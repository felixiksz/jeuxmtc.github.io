<!-- Le contenu d'un paquet Anki n'est pas fiable : cette page n'exécute que ses propres scripts et ne charge rien d'extérieur. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Cartes Anki</title>
<link href="../fonts/fonts.css?v=20261006-a" rel="stylesheet">
<style>
  /* Cartes Anki : les paquets Anki de la joueuse, révisés dans le jeu (cinq types de cartes : recto / verso, choix multiples
     en lettres, choix multiples « 10 options », texte à trous, paires). Les cartes restent sur l'appareil (IndexedDB). */
  :root{ --page-bg:#FCFCFA; --text-color:#271629; --shadow-color:#0000FF; --mtc-accent:#0000FF;
    --tint:color-mix(in srgb, var(--text-color) 58%, var(--page-bg)); --faint:color-mix(in srgb, var(--text-color) 16%, var(--page-bg));
    --good:#1a8a3a; --bad:#c0392b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text-color); font:400 15px/1.45 'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }
  main{ max-width:560px; margin:0 auto; padding:18px 20px 120px; }
  .sc{ font:800 .68rem/1.3 'Archivo', sans-serif; letter-spacing:.09em; text-transform:uppercase; }
  .t{ color:var(--tint); } a{ color:inherit; text-decoration:none; }
  button, label.btn{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; gap:12px; }
  h1{ font:400 1.7rem/1.15 'Libre Baskerville', Georgia, serif; margin:0 0 6px; }
  h2{ font:400 1.2rem/1.2 'Libre Baskerville', Georgia, serif; margin:30px 0 8px; padding-top:14px; border-top:1px solid var(--text-color); }
  .lead{ margin:0 0 16px; color:var(--tint); }
  .acc{ color:var(--mtc-accent); } .msg{ min-height:1.4em; margin:12px 0 0; } .err{ color:var(--bad); font-weight:800; } .okc{ color:var(--good); font-weight:800; }
  #file{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .imp{ display:inline-block; padding:4px 0; }
  .help{ color:var(--tint); font-size:.86rem; margin:12px 0 0; } .help b{ color:var(--text-color); }
  /* paquets importés */
  .pack{ display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-top:1px solid var(--faint); } .pack:last-of-type{ border-bottom:1px solid var(--faint); }
  .pack i{ font-style:normal; color:var(--tint); display:block; font-size:.8rem; }
  /* paquets Anki (arbre) */
  .tree{ margin:6px 0 0; } .dk{ display:flex; align-items:center; gap:2px; border-top:1px solid var(--faint); }
  .dk .chev{ width:26px; height:34px; color:var(--tint); flex:none; } .dk .chev.none{ visibility:hidden; }
  .dk .nm{ flex:1; min-width:0; text-align:left; padding:9px 0; } .dk .nm span{ display:block; line-height:1.25; }
  .dk .nm i{ font-style:normal; color:var(--tint); font-size:.76rem; }
  .dk.sel .nm span{ color:var(--mtc-accent); font-weight:800; } .dk.sel{ background:color-mix(in srgb, var(--mtc-accent) 7%, var(--page-bg)); }
  .len{ display:flex; gap:16px; align-items:baseline; margin:18px 0 0; } .len button{ color:var(--tint); } .len button.on{ color:var(--text-color); text-decoration:underline; text-decoration-color:var(--shadow-color); text-decoration-thickness:2px; text-underline-offset:5px; }
  /* barre du bas : sous le pouce */
  #bar{ position:fixed; left:0; right:0; bottom:0; background:var(--page-bg); border-top:1px solid var(--text-color); z-index:5; padding-bottom:env(safe-area-inset-bottom); }
  #bar .in{ max-width:560px; margin:0 auto; display:flex; }
  #bar button{ flex:1; padding:19px 8px 18px; text-align:center; } #bar button.main{ color:var(--mtc-accent); } #bar button.ok{ color:var(--good); } #bar button.no{ color:var(--bad); }
  #bar button:disabled{ opacity:.32; cursor:default; } #bar button + button{ border-left:1px solid var(--faint); }
  /* séance */
  .prog{ display:flex; gap:3px; margin:0 0 18px; } .prog i{ flex:1; height:3px; background:var(--faint); } .prog i.ok{ background:var(--good); } .prog i.no{ background:var(--bad); } .prog i.cur{ background:var(--text-color); }
  .card{ min-height:40vh; } .q{ font:400 1.12rem/1.5 'Libre Baskerville', Georgia, serif; margin:0 0 16px; } .q img, .ans img, .txt img, .pl img, .chip img{ max-width:100%; height:auto; display:block; margin:8px 0; }
  .ans{ margin-top:14px; padding-top:12px; border-top:1px solid var(--text-color); } .blk{ margin:0 0 12px; } .lbl{ display:block; font:800 .62rem 'Archivo', sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--tint); margin-bottom:2px; }
  .zh{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin:6px 0 12px; } .zh .hz{ font:400 1.7rem/1.2 'Libre Baskerville', Georgia, serif; } .zh .py{ font-size:1.05rem; }
  .tone1{color:#e74c3c} .tone2{color:#f39c12} .tone3{color:#27ae60} .tone4{color:#2980b9} .tone5{color:#8e44ad}
  .snd{ width:30px; height:30px; border:1px solid var(--text-color); border-radius:50%; font-size:.7rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; margin:0 3px; }
  .cz-blank{ color:var(--mtc-accent); font-weight:800; } .cz-hl{ color:var(--good); font-weight:800; }
  .opts{ display:flex; flex-direction:column; gap:8px; } .opt{ display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--faint); border-radius:10px; cursor:pointer; transition:border-color .15s, background .15s; }
  .opt .tag{ flex:none; width:20px; height:20px; margin-top:2px; border:1.6px solid var(--text-color); border-radius:50%; position:relative; } .opt.multi .tag{ border-radius:5px; }
  .opt.multi.on .tag::after, .opt.multi.good .tag::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid var(--page-bg); border-width:0 2px 2px 0; transform:rotate(45deg); }
  .opt:not(.multi).on .tag::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--page-bg); } .opt .txt{ flex:1; min-width:0; }
  .opt.on{ border-color:var(--mtc-accent); background:color-mix(in srgb, var(--mtc-accent) 8%, var(--page-bg)); } .opt.on .tag{ background:var(--mtc-accent); border-color:var(--mtc-accent); color:var(--page-bg); }
  .opt.good{ border-color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--page-bg)); } .opt.bad{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 9%, var(--page-bg)); }
  .opt.missed{ border-style:dashed; } .opt.neutral{ opacity:.6; } .opt .verdict{ font-weight:800; color:var(--tint); }
  .opt.kp{ cursor:default; flex-wrap:wrap; } .opt .yn{ display:flex; gap:8px; width:100%; } .opt .yn button{ padding:7px 18px; border:1px solid var(--text-color); border-radius:999px; font:800 .66rem 'Archivo', sans-serif; text-transform:uppercase; letter-spacing:.08em; }
  .opt .yn button.on{ background:var(--text-color); color:var(--page-bg); }
  .pairs{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; } .prow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--faint); border-radius:10px; }
  .prow.act{ border-color:var(--mtc-accent); } .prow.good{ border-color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--page-bg)); } .prow.bad{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 9%, var(--page-bg)); }
  .slot{ text-align:left; min-height:34px; padding:6px 10px; border:1px dashed var(--tint); border-radius:8px; color:var(--tint); } .prow .fix{ grid-column:1 / -1; color:var(--good); font-weight:800; font-size:.9rem; }
  .pool{ display:flex; flex-wrap:wrap; gap:8px; } .chip{ padding:8px 12px; border:1px solid var(--text-color); border-radius:999px; text-align:left; } .chip:disabled{ opacity:.25; }
  .sum{ margin:6px 0 18px; } .sum b{ font-size:1.4rem; font-family:'Libre Baskerville', Georgia, serif; font-weight:400; }
  [hidden]{ display:none !important; }
</style>
</head>
