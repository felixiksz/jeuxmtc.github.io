<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<meta name="robots" content="noindex, nofollow">
<title>Entraînement du jour</title>
<link href="../fonts/fonts.css?v=20261006-a" rel="stylesheet">
<style>
  /* Mode coach : la page d'ouverture du site, pour tout le monde.
     La page sur laquelle le site s'ouvre tant que l'entraînement du jour n'est pas terminé (redirection au début de index.html) :
     le programme du jour, rien d'autre. Le menu reste celui de la grille.
     Objectif du jour, série et entraînement : calculés sur les chiffres de l'appareil.
     L'entraînement se joue dans entrainement.html (bandeau au-dessus du jeu). */
  :root{ --page-bg:#FCFCFA; --text-color:#271629; --shadow-color:#0000FF; --mtc-accent:#0000FF;
    --tint:color-mix(in srgb, var(--text-color) 58%, var(--page-bg)); --faint:color-mix(in srgb, var(--text-color) 16%, var(--page-bg)); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text-color); font:400 15px/1.4 'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }
  main{ max-width:560px; margin:0 auto; padding:62px 20px 92px; min-height:100vh; }
  .sc{ font:800 .68rem/1.3 'Archivo', sans-serif; letter-spacing:.09em; text-transform:uppercase; }
  .t{ color:var(--tint); }
  a{ color:inherit; text-decoration:none; }
  /* Les boutons permanents (Menu, Coach / Libre, Série, recherche, panier, comparer, collection, soutien, message) sont aux mêmes
     endroits que sur la grille, quel que soit le mode : mêmes décalages, mêmes tailles que dans 69-main-menu.css. */
  .mrow{ position:absolute; top:13px; left:8px; right:8px; max-width:calc(100% - 16px); display:flex; justify-content:space-between; align-items:center; padding:0 6px; gap:10px; z-index:3; }
  .mmenu{ order:-1; padding:6px 4px; font:700 7.92px 'Archivo', sans-serif; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; color:var(--text-color); }
  .ph{ width:76.3px; height:20px; }
  .goalbar{ height:3px; background:var(--faint); margin:7px 0 30px; }
  .goalbar i{ display:block; height:3px; background:var(--mtc-accent); width:0; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  h1{ font:400 1.7rem/1.15 'Libre Baskerville', Georgia, serif; margin:0; }
  h2{ font:400 1.35rem/1.2 'Libre Baskerville', Georgia, serif; margin:34px 0 0; padding-top:14px; border-top:1px solid var(--text-color); }
  .lead{ margin:6px 0 18px; color:var(--tint); }
  .sub{ display:block; margin:18px 0 10px; }
  /* les outils de révision : séparés des jeux par un filet */
  .sub.outils{ margin-top:24px; padding-top:14px; border-top:1px solid var(--faint); }
  .tiles{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px 10px; }
  .tiles.s4{ grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px 6px; }
  .tile{ display:block; text-align:center; font-size:.84rem; line-height:1.25; }
  .tile svg{ display:block; width:68px; height:68px; margin:0 auto 6px; overflow:visible; transition:transform .3s cubic-bezier(.3,1.5,.5,1); }
  .tiles.s4 .tile svg{ width:58px; height:58px; }
  .tile:hover svg{ transform:translateY(-3px); } .tile:hover .n{ color:var(--mtc-accent); }
  .tile .w{ display:block; color:var(--tint); font-size:.74rem; margin-top:1px; }
  .tile .k{ display:block; font:800 .68rem 'Archivo', sans-serif; margin-bottom:4px; }
  /* le programme de l'entraînement : une ligne par étape, numéro, vignette du jeu, ce qu'on y travaille */
  .step{ display:grid; grid-template-columns:12px 44px minmax(0, 1fr) auto; gap:0 14px; align-items:center; padding:9px 0; border-top:1px solid var(--faint); }
  .step:last-child{ border-bottom:1px solid var(--faint); }
  .step > svg{ display:block; width:44px; height:44px; overflow:visible; }
  .step .k{ font:800 .68rem 'Archivo', sans-serif; text-align:center; } .step .k svg{ display:block; width:12px; height:12px; }
  .step .n{ display:block; line-height:1.25; }
  .step .w{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--tint); font-size:.8rem; line-height:1.25; margin-top:1px; }
  .step:hover .n{ color:var(--mtc-accent); }
  /* étape faite : cochée et estompée ; étape en cours : numéro en bleu */
  .step.fait > svg, .step.fait .tx, .step.fait .k{ opacity:.42; } .step.fait .k:has(svg){ opacity:1; } .step.encours .k, .step.encours .p{ color:var(--mtc-accent); }
  .again{ margin-left:18px; color:var(--tint); cursor:pointer; background:none; border:0; padding:0; }
  .later{ display:block; margin:10px 0 0; }
  /* les questions du coach : une réponse par ligne, comme les étapes du programme */
  .step.ch{ grid-template-columns:minmax(0, 1fr) auto; width:100%; background:none; border:0; border-top:1px solid var(--faint); border-bottom:1px solid var(--faint); margin-top:-1px;
    font:inherit; color:inherit; text-align:left; cursor:pointer; padding:13px 0; }
  .step.ch:hover .p{ color:var(--mtc-accent); }
  .back, .encore{ display:block; margin:16px 0 0; background:none; border:0; padding:0; cursor:pointer; }
  /* Même langage visuel que la grille libre : des mots en Libre Baskerville gras, sans cadre ni filet, posés sur le papier avec la
     même ombre douce (drop-shadow) que les tuiles ; les étapes forment une grille comme les points de la grille. */
  #seance{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:4px; margin:10px 0 6px; }
  .step, .step.ch{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; position:relative; width:100%; padding:20px 8px 14px; border:0; background:none; margin:0;
    filter:drop-shadow(rgba(0, 0, 0, .18) 0 4px 8px); cursor:pointer; }
  .step:last-child{ border-bottom:0; }
  .step > svg{ width:50px; height:50px; }
  .step .k{ position:absolute; top:10px; left:10px; font:800 .66rem 'Archivo', sans-serif; text-align:left; }
  .step .p{ position:absolute; top:10px; right:10px; }
  .step .tx{ display:block; min-width:0; }
  .step .n{ font:800 .86rem/1.25 'Libre Baskerville', serif; letter-spacing:.02em; }
  .step .w{ margin-top:3px; font-size:.74rem; text-align:center; -webkit-line-clamp:3; }
  /* questions du coach : une colonne, les règles des jeux en entier */
  #seance.q{ grid-template-columns:1fr; gap:2px; } .step.ch .w{ display:block; -webkit-line-clamp:unset; overflow:visible; font-size:.8rem; line-height:1.35; margin-top:4px; }
  .step.ch{ padding:14px 14px 12px; }
  .step.encours .n, .step.ch:hover .n{ text-decoration:underline; text-decoration-color:var(--shadow-color); text-decoration-thickness:2px; text-underline-offset:5px; }
  .step.ch .p{ display:none; }
  .step.ch .n{ font-size:.95rem; } .step.ch{ padding:16px 8px 14px; min-height:64px; justify-content:center; }
  h1{ font-weight:700; }
  #seance .back{ grid-column:1 / -1; text-align:left; margin-top:10px; }
  .encore{ margin-top:10px; color:var(--mtc-accent); }
  [hidden]{ display:none !important; }
  /* Coach / Libre : le même interrupteur que sur la grille (comme Auto / Manuel) ; le choix est gardé sur l'appareil (mtc_coach) */
  .mode{ display:inline-flex; align-items:baseline; gap:2px; white-space:nowrap; font:400 12px 'Archivo', sans-serif; letter-spacing:.03em; }
  .mode button{ background:none; border:0; padding:6px 3px; color:var(--text-color); cursor:pointer; font-family:'Archivo', sans-serif; font-weight:700; font-size:inherit; line-height:normal; text-transform:uppercase; letter-spacing:.06em; }
  .mode button.on{ text-decoration:underline; text-decoration-color:var(--shadow-color); text-decoration-thickness:2px; text-underline-offset:5px; }
  svg .l{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  svg .d{ stroke-dasharray:3 3.4; }
  svg .a{ stroke:var(--mtc-accent); } svg .af{ fill:var(--mtc-accent); stroke:var(--mtc-accent); }
  svg .f{ fill:currentColor; stroke:none; } svg .bg{ fill:var(--page-bg); }
  svg text{ font:800 13px 'Archivo', sans-serif; fill:var(--mtc-accent); text-anchor:middle; dominant-baseline:central; }
  .go{ display:inline-block; margin:18px 0 6px; color:var(--mtc-accent); transition:letter-spacing .25s; }
  .go:hover{ letter-spacing:.14em; }
  .idee{ margin-top:40px; padding:14px 0 0; border-top:1px solid var(--text-color); }
  .idee p{ margin:6px 0; }
  .chips{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0 6px; }
  .chip{ display:inline-flex; align-items:center; justify-content:center; min-width:40px; height:40px; padding:0 8px; border:1.6px solid var(--text-color); border-radius:999px; font-weight:800; font-size:.86rem; }
  .chip.q{ border-style:dashed; border-color:var(--mtc-accent); color:var(--mtc-accent); }
  .hop{ font-size:.74rem; color:var(--tint); }
  /* le lexique sous la main, sur toutes les pages : recherche, panier, comparer */
  #serie{ position:fixed; left:12px; bottom:20px; z-index:5; padding:2px 0; font:700 11px 'Archivo', sans-serif; text-transform:uppercase; letter-spacing:.07em; color:var(--text-color); }
  #serie small{ font-size:inherit; font-weight:400; margin-left:3px; }
  #bicons{ position:fixed; left:50%; bottom:14px; height:28px; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:12px; }
  #bicons a{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; color:var(--text-color); } #bicons svg{ width:16px; height:16px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  #drop, #mail{ position:fixed; bottom:13px; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; z-index:5; color:var(--text-color); }
  #drop{ right:54px; font-size:15px; line-height:15px; } #mail{ right:12px; font-size:14.3px; line-height:14.3px; }
  #bicons a:hover, #serie:hover, #mail:hover{ filter:drop-shadow(0 2px 6px var(--shadow-color)); }
  @media (min-width:761px){
    .mrow{ left:28px; right:28px; top:21px; max-width:none; } .mmenu{ font-size:18px; } .ph{ width:151.2px; height:31.6px; } .mode{ font-size:12px; letter-spacing:normal; }
    #serie{ left:16px; } #mail{ right:16px; font-size:24.3px; line-height:24.3px; } #drop, #mail{ width:30px; height:30px; } #bicons{ gap:22px; } #bicons svg{ width:17px; height:17px; }
  }
  @media (max-width:760px){ .mode{ font-size:11px; } }
  .note{ margin:30px 0 0; font-size:.8rem; color:var(--tint); }
</style>
</head>
<body>
<main>
  <div class="mrow"><a class="mmenu" id="menuLink" href="../index.html#ouvrir-menu">≡ Menu</a><span class="mode" id="mode"><button type="button" class="on" data-coach="1" title="Le jeu te donne des sujets à réviser">Coach</button>/<button type="button" data-coach="0" title="Tu choisis toi-même ce que tu révises">Libre</button></span><span class="ph" aria-hidden="true"></span></div>

  <span class="sc t" id="goalTxt">Aujourd’hui</span>
  <div class="goalbar"><i id="goalBar"></i></div>

  <h1 id="titre">Entraînement du jour</h1>
  <p class="lead" id="lead">Dix minutes, quatre sujets. Le programme change chaque jour.</p>
  <div id="seance"></div>
  <div id="actions">
    <a class="sc go" id="go" href="entrainement.html">Commencer →</a><button type="button" class="sc again" id="again" hidden>Refaire</button>
    <a class="sc t later" id="later" href="../index.html">Plus tard, aller à la grille</a>
    <button type="button" class="sc encore" id="encore" hidden>Continuer avec le coach →</button>
  </div>
  <p class="note" id="note">Le coach (non IA) compose le programme d’après tes réponses et tes résultats.</p>
  <p class="note"><button type="button" class="sc t" id="tourBtn" style="background:none;border:0;padding:0;cursor:pointer">Revoir les explications</button></p>




</main>
<a id="serie" href="../index.html#ouvrir-stats">Série</a>
<div id="bicons">
  <a href="../index.html#ouvrir-recherche" title="Recherche" aria-label="Recherche"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></a>
  <a href="../index.html#ouvrir-panier" title="Panier" aria-label="Panier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9H20L18.3 19.5H5.7Z"/><path d="M8.5 9L11 3.5M15.5 9L13 3.5"/></svg></a>
  <a href="../index.html#ouvrir-comparer" title="Comparer A | B" aria-label="Comparer A | B"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="7" height="15" rx="1.5"/></svg></a>
  <a href="../index.html#ouvrir-collection" title="Collection" aria-label="Collection"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="6" r="2.2" fill="currentColor"/><circle cx="12" cy="6" r="2.2"/><circle cx="18.5" cy="6" r="2.2" fill="currentColor"/><circle cx="5.5" cy="12.5" r="2.2"/><circle cx="12" cy="12.5" r="2.2" fill="currentColor"/><circle cx="18.5" cy="12.5" r="2.2"/><circle cx="5.5" cy="19" r="2.2" fill="currentColor"/><circle cx="12" cy="19" r="2.2"/><circle cx="18.5" cy="19" r="2.2" fill="currentColor"/></svg></a>
</div>

<script>
(function(){
  // ---------- vignettes : le plateau de chaque jeu, en traits fins ----------
  const svg = inner => '<svg viewBox="0 0 64 64" aria-hidden="true">' + inner + "</svg>";
  const c = (x, y, r, cls) => '<circle class="l ' + (cls || "") + '" cx="' + x + '" cy="' + y + '" r="' + r + '"/>';
  const ln = (x1, y1, x2, y2, cls) => '<path class="l ' + (cls || "") + '" d="M' + x1 + " " + y1 + "L" + x2 + " " + y2 + '"/>';
  const tx = (x, y, s, size) => '<text x="' + x + '" y="' + y + '"' + (size ? ' style="font-size:' + size + 'px"' : "") + ">" + s + "</text>";
  const P4 = [[20, 20], [44, 20], [20, 44], [44, 44]];
  // grille 4 × 4 : un groupe de quatre trouvé
  const grid = hi => { let s = ""; for(let r = 0; r < 4; r++) for(let k = 0; k < 4; k++){ const on = hi === "row" ? r === 1 : k === 2;
    s += '<rect class="l ' + (on ? "af" : "") + '" x="' + (5 + k * 14) + '" y="' + (5 + r * 14) + '" width="11" height="11" rx="2.5"/>'; } return svg(s); };
  // circuit : deux canaux de main en haut, deux de pied en bas
  const circ = (cls, links) => (links === false ? "" : ln(29, 20, 35, 20) + ln(29, 44, 35, 44) + ln(20, 29, 20, 35) + ln(44, 29, 44, 35)) + P4.map((p, i) => c(p[0], p[1], 9, cls ? cls[i] : "")).join("");
  const V = {
    grille: grid("row"),
    quiz: svg('<rect class="l" x="9" y="7" width="46" height="50" rx="4"/>' + ln(17, 18, 47, 18) + ln(17, 24, 38, 24) +
      c(19, 35, 2.6) + ln(26, 35, 46, 35) + c(19, 43, 2.6, "af") + ln(26, 43, 46, 43, "a") + c(19, 51, 2.6) + ln(26, 51, 40, 51)),
    memo: svg('<rect class="l bg" x="10" y="14" width="27" height="38" rx="3" transform="rotate(-9 23 33)"/><rect class="l bg" x="27" y="12" width="27" height="38" rx="3" transform="rotate(8 40 31)"/>' +
      '<path class="l a" transform="rotate(8 40 31)" d="M33 22H48M33 28H44"/>'),
    // Équilibrer : l'horloge des douze canaux et un lien entre deux d'entre eux
    equilibrer: svg(c(32, 32, 25) + Array.from({length:12}, (v, i) => { const a = i * Math.PI / 6 - Math.PI / 2; return '<circle class="' + (i === 1 || i === 7 ? "af" : "f") + '" cx="' + (32 + 25 * Math.cos(a)).toFixed(1) + '" cy="' + (32 + 25 * Math.sin(a)).toFixed(1) + '" r="' + (i === 1 || i === 7 ? 3.4 : 2) + '"/>'; }).join("") +
      ln(44.5, 10.3, 19.5, 53.7, "a")),
    // itinéraire par les liens : deux correspondances plutôt qu'un lien direct qui n'existe pas
    liens: svg(ln(12, 48, 32, 16, "a") + ln(32, 16, 52, 48, "a") + ln(19, 48, 45, 48, "d") + c(12, 48, 7, "bg") + c(52, 48, 7, "bg") + '<circle class="l af" cx="32" cy="16" r="7"/>'),
    // Correspondance : une ligne, des travaux au bout, une rame qui change de ligne à une station
    metro: svg(ln(6, 20, 46, 20) + '<path class="l a" d="M26 20V40Q26 48 34 48H58"/>' + c(26, 20, 4.6, "bg") + '<rect class="f" x="8" y="9" width="13" height="7" rx="2"/>' +
      '<path class="l" d="M50 14V26M58 14V26"/><rect class="l bg" x="47" y="10" width="14" height="6" rx="1"/>' + '<circle class="af" cx="58" cy="48" r="3.4"/>'),
    familles: svg(Array.from({length:12}, (v, i) => { const k = i % 3, r = (i - k) / 3; return '<circle class="l ' + (r === 2 ? "af" : "") + '" cx="' + (14 + k * 18) + '" cy="' + (11 + r * 14) + '" r="4.6"/>'; }).join("")),
    fermer: svg(circ(["", "", "", "d a"]) + tx(44, 44, "?")),
    quel: svg(circ(["d", "d", "d", "d"], false) + tx(32, 32, "?")),
    oupas: svg(circ(null, false) + '<path class="l a" d="M6 28L2 32L6 36M58 28L62 32L58 36"/>'),
    plaintes: svg([14, 32, 50].map(y => ln(11, y, 30, 32, "a") + '<circle class="af" cx="9" cy="' + y + '" r="3"/>').join("") +
      [[40, 24], [54, 24], [40, 40], [54, 40]].map(p => c(p[0], p[1], 5.4)).join("") + ln(45.4, 24, 48.6, 24) + ln(45.4, 40, 48.6, 40) + ln(40, 29.4, 40, 34.6) + ln(54, 29.4, 54, 34.6)),
    propagation: svg(ln(15, 32, 19, 32, "a") + ln(31, 32, 35, 32, "a") + ln(47, 32, 51, 32, "d") + '<circle class="l af" cx="9" cy="32" r="6"/><circle class="l af" cx="25" cy="32" r="6"/>' + c(41, 32, 6, "a") + c(57, 32, 6, "d")),
    cache: svg(circ(["af", "d", "d", "d"]) + tx(44, 20, "?") + tx(20, 44, "?") + tx(44, 44, "?")),
    grillePh: grid("col"),
    manquante: svg(ln(12, 14, 52, 14) + ln(12, 20, 38, 20) + [9, 23, 37, 55].map((x, i) => c(x, 40, i === 3 ? 7.4 : 4.6, i === 3 ? "d a" : "")).join("") + tx(55, 40.4, "?", 10)),
    cas: svg('<rect class="l" x="12" y="6" width="40" height="52" rx="4"/>' + ln(20, 16, 44, 16) + ln(20, 22, 38, 22) + '<path class="l a" d="M18 38H25L29 30L34 46L38 38H46"/>' + ln(20, 50, 36, 50)),
    // ---------- outils de révision ----------
    // Mémo : le tableau de tout, rangé par catégorie
    tableau: svg('<rect class="l" x="8" y="9" width="48" height="46" rx="4"/>' + ln(8, 21, 56, 21) + ln(25, 9, 25, 55) + ln(8, 32.5, 56, 32.5) + ln(8, 44, 56, 44) + ln(31, 27, 49, 27, "a") + ln(31, 38.5, 44, 38.5) + ln(31, 49.5, 47, 49.5)),
    recherche: svg(c(27, 27, 16) + ln(39, 39, 55, 55) + ln(20, 24, 34, 24, "a") + ln(20, 30, 29, 30)),
    // Comparer : deux fiches côte à côte, la ligne qui les distingue en bleu
    comparer: svg('<rect class="l" x="8" y="10" width="21" height="44" rx="3"/><rect class="l" x="35" y="10" width="21" height="44" rx="3"/>' +
      ln(13, 20, 24, 20) + ln(13, 28, 24, 28, "a") + ln(13, 36, 21, 36) + ln(40, 20, 51, 20) + ln(40, 28, 48, 28, "a") + ln(40, 36, 51, 36)),
    // Trajets : le trajet d'un canal, ses points le long du chemin
    trajets: svg('<path class="l" d="M16 7C16 26 31 22 31 36S46 44 48 57"/>' + [[16, 7], [22, 24], [31, 36], [41, 46], [48, 57]].map((q, i) => '<circle class="' + (i === 2 ? "af" : "f") + '" cx="' + q[0] + '" cy="' + q[1] + '" r="' + (i === 2 ? 3.8 : 2.6) + '"/>').join("")),
    // Plan des intersections : des lignes qui se croisent, une station à chaque croisement
    plan: svg(ln(6, 22, 58, 22) + ln(24, 6, 24, 58) + ln(46, 6, 46, 58) + ln(8, 54, 58, 29, "a") + c(24, 22, 4.2, "bg") + c(46, 22, 4.2, "bg") + c(24, 46, 4.2, "bg a") + '<circle class="l af" cx="46" cy="35" r="4.2"/>'),
    // Formules : le bol de décoction
    formules: svg('<path class="l" d="M9 30H55C55 44 45 53 32 53S9 44 9 30Z"/>' + ln(24, 58, 40, 58) + [22, 32, 42].map(x => '<path class="l a" d="M' + x + " 23C" + (x - 3) + " 19 " + (x + 3) + " 15 " + x + ' 10"/>').join("")),
    // ---------- suivi ----------
    stats: svg('<path class="l" d="M10 8V54H56"/><path class="l a" d="M17 44L27 33L36 38L50 17"/>' + [[17, 44], [27, 33], [36, 38], [50, 17]].map(q => '<circle class="af" cx="' + q[0] + '" cy="' + q[1] + '" r="2.6"/>').join("")),
    panier: svg('<path class="l" d="M9 26H55L50 54H14Z"/><path class="l" d="M22 26L29 9M42 26L35 9"/>' + ln(22, 36, 42, 36, "a") + ln(24, 45, 40, 45)),
    // Collection : ce qui est trouvé, rangée par rangée
    collection: svg([5, 3, 1].map((n, r) => Array.from({length:5}, (v, k) => '<circle class="' + (k < n ? (r === 1 && k === 2 ? "af" : "f") : "l") + '" cx="' + (10 + k * 11) + '" cy="' + (18 + r * 14) + '" r="' + (k < n ? 4 : 3.4) + '"/>').join("")).join("")),
    // Série : le calendrier des jours joués
    jours: svg('<rect class="l" x="8" y="12" width="48" height="43" rx="4"/>' + ln(8, 24, 56, 24) + ln(20, 7, 20, 16) + ln(44, 7, 44, 16) +
      [0, 1, 2, 3, 4, 5].map(i => '<circle class="' + (i < 4 ? "af" : "l") + '" cx="' + (20 + (i % 3) * 12) + '" cy="' + (34 + Math.floor(i / 3) * 11) + '" r="' + (i < 4 ? 3.2 : 2.8) + '"/>').join(""))
  };
  const tile = g => '<a class="tile" href="' + g[2] + '"' + (g[5] ? ' data-dom="' + g[5] + '"' : "") + ">" + (g[4] ? '<span class="k">' + g[4] + "</span>" : "") + V[g[0]] + '<span class="n">' + g[1] + "</span>" + (g[3] ? '<span class="w">' + g[3] + "</span>" : "") + "</a>";
  const fill = (id, list) => { document.getElementById(id).innerHTML = list.map(tile).join(""); };

  // ---------- vrais chiffres : objectif du jour et série ----------
  const read = k => { try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } };
  const d = new Date(), today = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  const mine = read("mtc_daily_goal_v1"), others = read("mtc_daily_goal_others_v1");
  const done = (mine && mine.d === today ? Number(mine.n) || 0 : 0) + (others && others.d === today ? Number(others.n) || 0 : 0), goal = 20;
  document.getElementById("goalTxt").textContent = "Aujourd’hui · " + done + " sur " + goal;
  requestAnimationFrame(() => { document.getElementById("goalBar").style.width = Math.min(100, Math.round(done / goal * 100)) + "%"; });
  const s = read("mtc_daily_streak_v1"), n = s && Number(s.count) || 0;
  document.getElementById("serie").innerHTML = "Série " + n + "<small>" + (n > 1 ? "jours" : "jour") + "</small>";

  // ---------- l'entraînement du jour : quatre étapes, vingt bonnes réponses (l'objectif du jour) ----------
  const KEY = "mtc_entrainement_v1", VER = 3;   // VER : un programme enregistré avec une ancienne forme est recalculé
  // la plus ratée d'une liste de catégories ou de classes déjà vues
  const worst = o => { let w = null; Object.values(o || {}).forEach(c => { const seen = Number(c.seen) || 0, err = Number(c.errors) || 0;
    if(c.name && seen >= 2 && err > 0 && (!w || err / seen > w.r)) w = {r:err / seen, name:String(c.name)}; }); return w; };
  // ---------- les jeux que le coach peut proposer ----------
  const numJour = extra => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + (extra || 0) * 5;
  function catalogue(jour){
    const A = "acupuncture", P = "pharmacology", G = "../index.html", C = "../circuits/index.html", F = "../formules/index.html";
    // les points arrivés à échéance au Quiz
    let due = 0;
    try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.indexOf("mtc_quiz_mastery_") === 0){ const r = read(k); if(r && r.dueAt && new Date(r.dueAt).getTime() <= Date.now()) due++; } } }catch(e){}
    // la ligne de Correspondance : le canal le moins maîtrisé (anneaux des Réseaux), sinon une ligne différente chaque jour
    const J = window.MTC_TRAJETS_JIAOHUI || {}, cnt = {};
    Object.entries(J).forEach(([code, v]) => { const own = code.split(" ")[0]; if([...new Set((v.canaux || []).concat(v.certains || []))].some(c => c !== own)) cnt[own] = (cnt[own] || 0) + 1; });
    const lines = ["GI", "E", "Rt", "IG", "V", "TF", "VB"].filter(c => cnt[c] >= 3), ms = read("mtc_circuits_mastery_v1") || {};
    let weak = null; lines.forEach(c => { const m = ms[c]; if(m && m.n >= 1 && (!weak || m.v < weak.v)) weak = {c, v:Number(m.v) || 0}; });
    const line = weak ? weak.c : lines[jour % lines.length];
    // Jamais le nom d'une catégorie ou d'une classe dans ces libellés : ce serait donner une réponse.
    return {due, jeux:{
      grille:{v:"grille", t:"Grille", w:"une grille de points", u:G, dom:A, q:4},
      quiz:{v:"quiz", t:"Quiz", w:due >= 6 ? due + " points à revoir" : "les points de la grille", u:G, dom:A, init:due >= 6 ? "due" : "quiz", q:6},
      revoir:{v:"quiz", t:"Quiz", w:due + (due > 1 ? " points à revoir" : " point à revoir"), u:G, dom:A, init:"due", q:Math.max(1, Math.min(6, due))},
      metro:{v:"metro", t:"Correspondance", w:"ligne " + line, u:"../trajets/correspondance.html?ligne=" + line, q:5},
      equilibrer:{v:"equilibrer", t:"Équilibrer", w:"les six systèmes", u:C + "#equilibrer", q:3},
      familles:{v:"familles", t:"Grille des familles", w:"les familles de canaux", u:C + "#grille", q:4},
      oupas:{v:"oupas", t:"Circuit ou pas ?", w:"oui ou non", u:C + "#circuitoupas", q:5},
      fermer:{v:"fermer", t:"Fermer le circuit", w:"compléter un circuit", u:C + "#fermer", q:3},
      quel:{v:"quel", t:"Quel circuit ?", w:"reconnaître un circuit", u:C + "#quel", q:5},
      plaintes:{v:"plaintes", t:"Trois plaintes", w:"trois plaintes, un circuit", u:C + "#plaintes", q:3},
      propagation:{v:"propagation", t:"Propagation", w:"suivre la propagation", u:C + "#propagation", q:3},
      cache:{v:"cache", t:"Le cas mystère", w:"un cas à résoudre", u:C + "#cache", q:2},
      grillePh:{v:"grillePh", t:"Grille", w:"une grille de substances", u:G, dom:P, q:4},
      manquante:{v:"manquante", t:"Substance manquante", w:"des formules à compléter", u:F + "#jeu", q:5},
      cas:{v:"cas", t:"Cas clinique", w:"une consultation", u:F + "#cas", q:1}}};
  }
  const HOW = (window.MTC_COACH || {}).how || {};
  const programme = (steps, extra, choix) => ({d:today, ver:VER, extra:extra || 0, choix:choix || "", steps:steps.map(s => Object.assign({h:HOW[s.v] || ""}, s)), i:0, n:steps.map(() => 0), fin:false});
  // Le programme du jour : quatre sujets (les points, les canaux, les circuits, la pharmacopée), un jeu par sujet. D'un jour à l'autre,
  // le jeu de chaque sujet change et l'ordre des sujets tourne.
  function varie(extra){
    const jour = numJour(extra), K = catalogue(jour).jeux, tour = list => list[jour % list.length];
    const sujets = [tour([K.grille, K.quiz]), tour([K.metro, K.equilibrer, K.familles]), tour([K.oupas, K.fermer, K.quel, K.plaintes, K.propagation, K.cache]), tour([K.grillePh, K.manquante, K.cas])], k = jour % 4;
    return sujets.slice(k).concat(sujets.slice(0, k));
  }
  const build = extra => programme(varie(extra), extra);

  // ---------- après l'entraînement du jour : le coach demande ce qu'on veut réviser ----------
  // Un arbre de questions : chaque réponse mène à une autre question, ou à des jeux. Les réponses du jour font le programme.
  const TOUT = "Un peu de tout";
  const arbre = due => ({q:"Que veux-tu réviser ?", c:[
    {t:"L’acupuncture", q:"Quoi, en acupuncture ?", c:[
      {t:"Les points", q:"Comment veux-tu les revoir ?", c:[
        {t:"Retrouver des groupes de points", w:"Grille : " + HOW.grille, jeux:["grille"]},
        {t:"Répondre à des questions", w:"Quiz : " + HOW.quiz, jeux:["quiz"]},
        due > 0 && {t:"Revoir mes erreurs", w:"Quiz sur les " + due + (due > 1 ? " points" : " point") + " à revoir : ceux que tu as ratés, ou qui reviennent.", jeux:["revoir"]},
        {t:TOUT, w:"Une grille et un quiz.", jeux:["grille", "quiz"]}]},
      {t:"Les canaux", q:"Quoi, sur les canaux ?", c:[
        {t:"Où ils se croisent", w:"Correspondance : " + HOW.metro, jeux:["metro"]},
        {t:"Les six systèmes", w:"Équilibrer : " + HOW.equilibrer, jeux:["equilibrer"]},
        {t:"Les familles de canaux", w:"Grille des familles : " + HOW.familles, jeux:["familles"]},
        {t:TOUT, w:"Un jeu de chaque.", jeux:["metro", "equilibrer", "familles"]}]},
      {t:"Les circuits", q:"Quoi, sur les circuits ?", c:[
        {t:"Les reconnaître", w:"Circuit ou pas ? : " + HOW.oupas + "\\nQuel circuit ? : " + HOW.quel, jeux:["oupas", "quel"]},
        {t:"Les construire", w:"Fermer le circuit : " + HOW.fermer, jeux:["fermer"]},
        {t:"Raisonner sur un cas", w:"Trois plaintes : " + HOW.plaintes + "\\nPropagation : " + HOW.propagation + "\\nLe cas mystère : " + HOW.cache, jeux:["plaintes", "propagation", "cache"]},
        {t:TOUT, w:"Un peu de chaque.", jeux:["oupas", "fermer", "plaintes", "quel"]}]},
      {t:TOUT, w:"Les points, les canaux et les circuits.", jeux:["grille", "metro", "oupas", "quiz"]}]},
    {t:"La pharmacopée", q:"Quoi, en pharmacopée ?", c:[
      {t:"Les substances", w:"Grille : " + HOW.grillePh, jeux:["grillePh"]},
      {t:"Les formules", w:"Substance manquante : " + HOW.manquante, jeux:["manquante"]},
      {t:"Un cas clinique", w:"Cas clinique : " + HOW.cas, jeux:["cas"]},
      {t:TOUT, w:"Une grille, une substance manquante et un cas clinique.", jeux:["grillePh", "manquante", "cas"]}]},
    {t:TOUT, w:"Le coach choisit, comme dans l’entraînement du jour.", jeux:null}]});
  // dernière question : le temps. Il fixe le nombre d'étapes ; avec peu de jeux, chaque étape dure plus longtemps.
  const TEMPS = {q:"Combien de temps ?", c:[{t:"Cinq minutes", L:2}, {t:"Dix minutes", L:4}, {t:"Vingt minutes", L:8}]};
  function surMesure(feuille, L, extra){
    const jour = numJour(extra), K = catalogue(jour).jeux;
    let list = feuille.jeux ? feuille.jeux.map(id => K[id]).filter(Boolean) : varie(extra);
    const r = jour % list.length; list = list.slice(r).concat(list.slice(0, r));     // l'ordre change d'un jour à l'autre
    if(list.length > L) list = list.slice(0, L);
    const fois = Math.max(1, Math.min(4, Math.round(L / list.length)));   // au plus quatre fois la durée normale d'un jeu
    return list.map(g => Object.assign({}, g, {q:g.q * fois}));
  }

  let T = read(KEY);
  if(!T || T.d !== today || T.ver !== VER || !Array.isArray(T.steps)){ T = build(); try{ localStorage.setItem(KEY, JSON.stringify(T)); }catch(e){} }
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(T)); }catch(e){} };
  const $ = id => document.getElementById(id), esc = t => String(t).replace(/[&<>]/g, "");
  const CHECK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path class="l a" d="M2 6.5L5 9.5L10.5 2.5"/></svg>';
  let Q = null;   // questions en cours : {chemin:[réponses], noeud, feuille}
  function drawTraining(){
    const begun = T.fin || T.i > 0 || T.n.some(x => x > 0);
    $("titre").textContent = T.choix ? "Ton programme" : "Entraînement du jour"; $("seance").classList.remove("q");
    $("seance").innerHTML = T.steps.map((st, i) => { const plein = T.n[i] >= st.q, fait = plein || T.fin || i < T.i, cur = !fait && begun && i === T.i;
      return '<a class="step' + (fait ? " fait" : cur ? " encours" : "") + '" href="entrainement.html#' + (i + 1) + '"><span class="k">' + (plein ? CHECK : i + 1) + "</span>" + V[st.v] +
        '<span class="tx"><span class="n">' + st.t + '</span><span class="w">' + esc(st.w) + '</span></span><span class="sc t p">' + (!plein && T.n[i] ? T.n[i] + " sur " + st.q : "") + "</span></a>"; }).join("");
    const go = $("go"), again = $("again");
    // entraînement terminé : la grille reprend sa place, ou le coach continue en demandant ce qu'on veut réviser
    go.textContent = T.fin ? "Aller à la grille →" : begun ? "Continuer →" : "Commencer →";
    go.setAttribute("href", T.fin ? "../index.html" : "entrainement.html");
    $("lead").textContent = T.fin ? "Terminé." + (T.choix ? "" : " C’était l’entraînement du jour.") : T.choix || "Dix minutes, quatre sujets. Le programme change chaque jour.";
    $("later").hidden = T.fin;
    $("encore").hidden = !T.fin;
    $("actions").hidden = false;
    if(again) again.hidden = !begun;
  }
  function drawQ(){
    const n = Q.noeud;
    $("titre").textContent = n.q;
    $("lead").textContent = Q.chemin.length ? Q.chemin.join(" › ") : "Tes réponses font le programme.";
    $("seance").innerHTML = n.c.filter(Boolean).map((c, i) => '<button type="button" class="step ch" data-ch="' + i + '"><span class="tx"><span class="n">' + esc(c.t) + "</span>" + (c.w ? '<span class="w">' + esc(c.w).replace(/\n/g, "<br>") + "</span>" : "") +
      '</span><span class="sc t p">→</span></button>').join("") + '<button type="button" class="sc t back" data-back="1">← ' + (Q.pile.length ? "Question précédente" : "Annuler") + "</button>";
    $("actions").hidden = true; $("seance").classList.add("q");
  }
  function ask(){ Q = {chemin:[], pile:[], noeud:arbre(catalogue(numJour()).due), feuille:null}; drawQ(); window.scrollTo(0, 0); }
  $("seance").addEventListener("click", e => {
    if(!Q) return;
    const b = e.target.closest("[data-ch], [data-back]");
    if(!b) return;
    if(b.dataset.back){
      if(!Q.pile.length){ Q = null; drawTraining(); return; }
      Q.noeud = Q.pile.pop(); Q.chemin.pop(); Q.feuille = null; drawQ(); return;
    }
    const c = Q.noeud.c.filter(Boolean)[+b.dataset.ch];
    if(Q.noeud === TEMPS){
      // toutes les réponses sont là : le programme sur mesure
      const extra = (T.extra || 0) + 1;
      T = programme(surMesure(Q.feuille, c.L, extra), extra, Q.chemin.concat(c.t.toLowerCase()).join(" › "));
      save(); Q = null; drawTraining(); return;
    }
    Q.pile.push(Q.noeud); Q.chemin.push(c.t);
    if(c.c){ Q.noeud = c; } else { Q.feuille = c; Q.noeud = TEMPS; }
    drawQ();
  });
  $("encore").addEventListener("click", ask);
  drawTraining();
  // le coach demandé depuis la grille (bouton « Coach ») alors que le programme est fini : il demande ce qu'on veut réviser
  if(/[?&]coach=1/.test(location.search)){
    if(T.fin) ask();
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  }
  // Coach / Libre : cette page est le mode coach ; « Libre » ouvre la grille, et le site s'y ouvrira désormais
  try{ localStorage.setItem("mtc_coach", "1"); }catch(e){}
  $("mode").addEventListener("click", e => { const b = e.target.closest("[data-coach]"); if(!b || b.dataset.coach !== "0") return;
    try{ localStorage.setItem("mtc_coach", "0"); }catch(er){} location.href = "../index.html"; });
  // « Refaire » sert aux essais : réservé au mode admin
  try{ if(localStorage.getItem("mtc_admin") !== "1") $("again").remove(); }catch(e){}
  // Tutoriel du coach : montré la première fois sur cet appareil (clé mtc_tour_coach_v1), puis à la demande (« Revoir les explications »).
  const TOUR = [
    {sel:"#mode", title:"Coach ou Libre", text:"Coach : le jeu te propose chaque jour un entraînement varié, sur des sujets différents. Libre : tu choisis toi-même ; le site s’ouvre alors directement sur la grille. Tu peux changer à tout moment, l’appareil retient ton choix."},
    {sel:"#seance", title:"Ton entraînement du jour", text:"Quatre étapes, un jeu par sujet : les points, les canaux, les circuits, la pharmacopée. Le programme change chaque jour. Chaque bonne réponse compte pour l’objectif du jour (20 par jour)."},
    {sel:".step", title:"Une étape", text:"Clique sur une étape pour la jouer tout de suite. Dans le jeu, une ligne rappelle la règle : par exemple, en pharmacopée, « Substance manquante » (retrouver la substance cachée d’une formule) ou « Cas clinique » (conseiller une formule à un·e patient·e)."},
    {sel:"#go", title:"Commencer", text:"Les étapes s’enchaînent. Sur téléphone, la barre du bas passe à l’étape suivante : touche-la, ou glisse-la vers la gauche."},
    {sel:"#later", title:"Plus tard", text:"Ouvre la grille sans faire l’entraînement. Il te sera reproposé à la prochaine ouverture du site."},
    {sel:"#note", title:"Quand c’est fini", text:"Clique sur « Continuer avec le coach » : il te demande ce que tu veux réviser (matière, sujet, façon de jouer, durée) et compose un programme d’après tes réponses. Chaque choix t’explique le jeu qu’il lance. Le coach n’est pas une IA : il suit tes réponses et tes résultats."}
  ];
  const tour = force => { if(!window.mtcTour || Q) return; const vis = s => { const e = document.querySelector(s); return !!e && e.getClientRects().length > 0; };
    window.mtcTour(TOUR.filter(t => vis(t.sel)), {key:"mtc_tour_coach_v1", force:!!force}); };
  $("tourBtn").addEventListener("click", () => tour(true));
  setTimeout(() => tour(false), 700);
  // « Plus tard » : la grille s'ouvre sans l'entraînement, jusqu'à la prochaine ouverture du site
  $("later").addEventListener("click", () => { try{ sessionStorage.setItem("mtc_entrainement_plus_tard", "1"); }catch(e){} });
  // (test) repartir de zéro, avec le programme du jour
  if($("again")) $("again").addEventListener("click", () => { T = build(); save(); Q = null; drawTraining(); });
  // retour depuis un jeu (page gardée en mémoire par le navigateur) : relire l'état
  window.addEventListener("pageshow", e => { if(e.persisted){ const t = read(KEY); if(t && t.d === today){ T = t; if(!Q) drawTraining(); } } });
})();
</script>
</body>
