<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<meta name="robots" content="noindex, nofollow">
<title>Quel canal ?</title>
<link href="../fonts/fonts.css?v=20261006-a" rel="stylesheet">
<link href="jeux-syndromes.css?v=20261124-a" rel="stylesheet">
</head>
<body>
<main>
  <div class="top"><a class="sc" id="back" href="../index.html">← Accueil</a><span class="sc t" id="score"></span></div>
  <h1>Quel canal ?</h1>
  <div class="prog" id="prog"></div>
  <p class="t" id="empty" hidden></p>
  <div id="stage">
    <p class="sc t pts" id="pts"></p>
    <div class="clues" id="clues"></div>
    <div id="ans"></div>
    <div style="margin:12px 0 0"><button type="button" class="lnk" id="more" hidden>Un indice de plus</button><button type="button" class="lnk" id="give" hidden>Voir la réponse</button></div>
    <div id="res"></div>
    <div class="rv" id="reveal" hidden></div>
  </div>
  <div id="end"></div>
  <div class="act"><span class="sc t" id="rec"></span><button type="button" class="sc go" id="next" hidden>Cas suivant →</button></div>
</main>
<footer><div><span class="tools">
  <a href="../index.html#ouvrir-recherche" target="_top" title="Recherche" aria-label="Recherche"><svg viewBox="0 0 24 24"><circle class="l" cx="10.5" cy="10.5" r="6.5"/><path class="l" d="M15.5 15.5L21 21"/></svg></a>
  <a href="../index.html#ouvrir-panier" target="_top" title="Panier" aria-label="Panier"><svg viewBox="0 0 24 24"><path class="l" d="M4 9H20L18.3 19.5H5.7Z"/><path class="l" d="M8.5 9L11 3.5M15.5 9L13 3.5"/></svg></a>
</span></div></footer>
<script src="../modules-theme.js?v=20261005-a"></script>
<script src="../celebrate.js?v=20261112-f"></script>
<script src="../70-progress-sync.js?v=20261112-b"></script>
<script src="../daily-streak-shared.js?v=20261006-a"></script>
<script src="../beta-config.js?v=20261119-a"></script>
<script src="../beta-gate.js?v=20261114-a"></script>
<script src="jeux-syndromes.js?v=20261124-a"></script>
<script>
(function(){
  "use strict";
  // accès : comme le module Trajets (beta-gate.js)
  if(!window.mtcBetaGate || !window.mtcBetaGate({module:"quelcanal", title:"Quel canal ?"})){
    if(!window.mtcBetaGate) document.body.innerHTML = '<p style="padding:24px;font-family:system-ui,sans-serif">Page réservée.</p>';
    throw new Error("quel canal : accès réservé");
  }
  // Les signes d'un canal et d'un de ses vaisseaux (régulier, luo, tendineux, grand luo) arrivent un par un, tirés des syndromes de l'Assistant.
  // Trouver le canal ET le vaisseau avec le moins d'indices ; chaque réponse est vérifiée tout de suite.
  // 10 points avec le premier indice, -1 par indice de plus, -1 par erreur (au moins 1). Une série = dix cas, avec un record.
  const Y = window.mtcSyn, $ = id => document.getElementById(id), main = document.querySelector("main");
  const {esc, rnd, shuffle, pill, col, NIV, NIVNOM, ORD, NAMES} = Y;
  const N = 10, RKEY = "mtc_quelcanal_record_v1";
  const best = () => { try{ return Number(localStorage.getItem(RKEY)) || 0; }catch(e){ return 0; } };
  if(window.top !== window) $("back").style.visibility = "hidden";
  let S = null, R = null;
  const points = () => Math.max(1, 10 - (R.shown - 1) - R.wrong);

  function head(){
    const k = S.marks.length, fin = main.classList.contains("fin");
    $("score").textContent = fin ? "Série terminée" : "Cas " + Math.min(N, k + (R && R.done ? 0 : 1)) + " sur " + N;
    $("prog").innerHTML = Array.from({length:N}, (v, i) => '<i class="' + (S.marks[i] || (i === k && !fin ? "cur" : "")) + '"></i>').join("");
    $("rec").textContent = best() ? "Record · " + best() + " points sur " + N * 10 : S.pts + " point" + (S.pts > 1 ? "s" : "");
  }
  function newSeries(){ S = {marks:[], pts:0, miss:[], last:null}; main.classList.remove("fin"); newRound(); }
  function newRound(){
    const pool = Y.usableSigns().filter(x => x.ok.length >= 2), list = pool.filter(x => !(S.last && S.last.c === x.c && S.last.n === x.n));
    if(!pool.length){ R = null; $("stage").hidden = true; $("empty").hidden = false; $("empty").innerHTML = Y.vide(); $("next").hidden = true; head(); return; }
    $("stage").hidden = false; $("empty").hidden = true;
    const g = rnd(list.length ? list : pool); S.last = g;
    R = {c:g.c, n:g.n, all:g.all, clues:shuffle(g.ok).slice(0, 5), shown:1, cOk:false, nOk:false, markC:{}, markN:{}, wrong:0, done:false, found:false, msg:""};
    $("next").hidden = true; draw(); head();
  }
  function draw(){
    if(!R) return;
    const c = R.c, D = Y.data(), hasGL = !!((D.canaux[c] || {}).grand_luo || []).length, shownT = new Set(R.clues.slice(0, R.shown).map(l => l.t));
    $("pts").textContent = R.done ? (R.found ? points() + " point" + (points() > 1 ? "s" : "") : "0 point") : "Encore " + points() + " point" + (points() > 1 ? "s" : "") + " en jeu";
    $("clues").innerHTML = R.clues.slice(0, R.shown).map((l, i) => "<p><b>" + (i + 1) + ".</b> " + esc(l.t) + "</p>").join("");
    const canaux = ORD.map(x => { const mk = R.markC[x], on = R.cOk && x === c;
      return '<button type="button" class="pc' + (mk === "no" ? " mk-no" : "") + '" data-c="' + x + '" title="' + esc(NAMES[x]) + '" style="' + (on ? "background:" + col(x) + ";color:var(--page-bg);border-color:" + col(x) : "color:" + col(x)) + '"' + (R.done || (R.cOk && !on) ? " disabled" : "") + ">" + x + "</button>"; }).join("");
    const niv = NIV.map(([k, lab]) => { const mk = R.markN[k], on = R.nOk && k === R.n, off = R.done || (R.nOk && !on) || (R.cOk && k === "grand_luo" && !hasGL);
      return '<button type="button" class="pc' + (mk === "no" ? " mk-no" : "") + '" data-n="' + k + '" style="' + (on ? "background:var(--text-color);color:var(--page-bg)" : "color:var(--text-color)") + '"' + (off ? " disabled" : "") + ">" + esc(lab) + "</button>"; }).join("");
    $("ans").innerHTML = R.done ? "" : '<p class="q">Quel canal ?</p><div class="row">' + canaux + '</div><p class="q">Quel vaisseau ?</p><div class="row">' + niv + "</div>";
    $("more").hidden = R.done || R.shown >= R.clues.length; $("give").hidden = R.done;
    $("res").innerHTML = R.msg;
    const rv = $("reveal");
    if(R.done){
      rv.hidden = false;
      rv.innerHTML = "<p>" + pill(c) + " <b>" + esc(NAMES[c]) + "</b> · " + esc(NIVNOM[R.n]) + "</p><ul>" +
        R.all.map(l => "<li" + (shownT.has(l.t) ? ' class="hit"' : "") + ">" + esc(l.t) + (l.pv && !String(l.m || "").toLowerCase().startsWith(l.pv) ? ' <span class="mc">· ' + esc(l.pv) + "</span>" : "") +
          (l.m ? ' <span class="mc">· ' + esc(l.m) + "</span>" : "") + "</li>").join("") + "</ul>";
    }else{ rv.hidden = true; rv.innerHTML = ""; }
  }
  function finish(found){
    R.done = true; R.found = found;
    const p = found ? points() : 0;
    S.pts += p; S.marks.push(found && p >= 8 ? "ok" : "mid");
    if(!found || R.wrong > 0 || p < 8) S.miss.push({c:R.c, n:R.n, sign:R.clues[0].t});
    if(window.mtcRecordDailyPlay) window.mtcRecordDailyPlay();
    if(found){
      if(!R.wrong && R.shown <= 2 && window.mtcCelebrate) window.mtcCelebrate(1); else if(window.mtcPlayFx) window.mtcPlayFx("good");
      R.msg = '<span class="ok">Trouvé.</span> ' + pill(R.c) + " " + esc(NIVNOM[R.n].toLowerCase()) + " : " + p + " point" + (p > 1 ? "s" : "") + " avec " + R.shown + " indice" + (R.shown > 1 ? "s" : "") + ".";
    }else{
      if(window.mtcMiss) window.mtcMiss();
      R.msg = '<span class="no">Réponse :</span> ' + pill(R.c) + " " + esc(NIVNOM[R.n].toLowerCase()) + ".";
    }
    $("next").textContent = S.marks.length >= N ? "Voir le résultat →" : "Cas suivant →"; $("next").hidden = false;
    draw(); head();
  }
  function pickCanal(x){
    if(!R || R.done || R.cOk) return;
    if(R.markC[x] === "no"){ delete R.markC[x]; R.msg = ""; draw(); return; }
    if(x === R.c){
      R.cOk = true; R.markC[x] = "ok";
      if(R.nOk) return finish(true);
      if(window.mtcPlayFx) window.mtcPlayFx("good");
      R.msg = '<span class="ok">Oui.</span> C’est le canal ' + pill(x) + ". Et quel vaisseau ?";
    }else{
      R.markC[x] = "no"; R.wrong++; if(window.mtcMiss) window.mtcMiss();
      R.msg = '<span class="no">Non :</span> ces signes ne sont pas ceux du canal ' + pill(x) + ".";
    }
    draw();
  }
  function pickNiv(k){
    if(!R || R.done || R.nOk) return;
    if(R.markN[k] === "no"){ delete R.markN[k]; R.msg = ""; draw(); return; }
    if(k === R.n){
      R.nOk = true; R.markN[k] = "ok";
      if(R.cOk) return finish(true);
      if(window.mtcPlayFx) window.mtcPlayFx("good");
      R.msg = '<span class="ok">Oui.</span> ' + esc(NIVNOM[k]) + ". Et quel canal ?";
    }else{
      R.markN[k] = "no"; R.wrong++; if(window.mtcMiss) window.mtcMiss();
      R.msg = '<span class="no">Non :</span> pas ' + esc(NIVNOM[k].toLowerCase()) + ".";
    }
    draw();
  }
  $("stage").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b || b.disabled) return;
    if(b.dataset.c) pickCanal(b.dataset.c); else if(b.dataset.n) pickNiv(b.dataset.n);
    else if(b.id === "more"){ R.shown++; draw(); }
    else if(b.id === "give" && !R.done) finish(false);
  });
  function end(){
    const old = best(), rec = S.pts > old;
    if(rec){ try{ localStorage.setItem(RKEY, String(S.pts)); }catch(e){} }
    main.classList.add("fin");
    $("end").innerHTML = "<h2>" + S.pts + " points sur " + N * 10 + "</h2>" +
      '<p class="t">' + (rec && old ? "Nouveau record : l’ancien était de " + old + "." : rec ? "C’est ton premier record." : "Ton record : " + old + " points.") + "</p>" +
      (S.miss.length ? '<span class="sc t">À revoir</span><ul>' + S.miss.map(m => "<li>" + pill(m.c) + " " + esc(NIVNOM[m.n]) + "<small>" + esc(m.sign) + "</small></li>").join("") + "</ul>" : '<span class="sc t">Rien à revoir</span>');
    $("next").textContent = "Nouvelle série →"; $("next").hidden = false; head();
    if(S.pts >= 90 && window.mtcFinale) window.mtcFinale("Série parfaite", S.pts + " points sur " + N * 10, {etoiles:"✦✦✦"});
  }
  $("next").addEventListener("click", () => { if(main.classList.contains("fin")) newSeries(); else if(S.marks.length >= N) end(); else newRound(); });
  document.addEventListener("mtc-syndromes-ready", () => { if(!R) newSeries(); });
  newSeries();
})();
</script>
</body>
</html>
