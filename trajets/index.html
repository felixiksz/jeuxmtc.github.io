        if(!typeShown(s)) return "";
        const key = canal.code + "-" + si;
        // vérification publique du trajet (réaction 👍 sur son fil de corrections, voir beta-modules.js)
        const vterm = "Trajets — " + canal.code + " — " + s.label;
        return '<section id="sec-' + si + '"><h3>' + esc(s.label) +
          '<button type="button" class="verifybtn" data-verify="' + esc(vterm) + '" data-label="' + esc(canal.code + " — " + s.label) + '" title="Vérifier ce trajet (vérification publique)">✓ <span>Vérifier</span></button></h3>' +
          '<div class="cols"><div class="desc">' +
            s.paragraphs.map((p, pi) => {
              const k = canal.code + "|" + si + "|" + pi, bullet = /^- /.test(p);
              return "<p" + (bullet ? ' class="li' : ' class="') + (k in edits.paras ? " edited" : "") + '" data-para="' + esc(k) + '"' +
                (bullet ? ' data-bullet="1"' : "") + ce + ">" + withRefs(bullet ? p.slice(2) : p, key) + "</p>";
            }).join("") +
            (s.notes.length ? "<details" + (editing ? " open" : "") + "><summary>Notes (" + s.notes.length + ")</summary><ol>" +
              s.notes.map((n, ni) => {
                const k = canal.code + "|" + si + "|" + ni;
                return '<li id="' + key + "-n" + n.n + '" value="' + (n.n || "") + '" data-note="' + esc(k) + '"' + (k in edits.notes ? ' class="edited"' : "") + ce + ">" + esc(n.text) + "</li>";
              }).join("") + "</ol></details>" : "") +
            "</div>" +
            '<div class="imgs">' + s.images.map(i => '<img loading="lazy" alt="" data-src="' + esc(i.src) + '" title="page ' + i.page + '">').join("") + "</div>" +
            '<div class="plancol">' + planSvg(s, sectionName(canal, s)) +
              '<div class="stops-edit"><b>Arrêts du plan</b> — une ligne par branche, arrêts séparés par → (ou ->)' +
              '<textarea data-branches="' + esc(canal.code + "|" + si) + '"' + (canal.code + "|" + si in edits.branches ? ' class="edited"' : "") + ">" +
              esc((s.branches || []).map(b => b.places.map(pid => (PLACES[pid] || {label:pid}).label).join(" → ")).join("\n")) + "</textarea>" +
              "Points : « Rt 4 » · canaux : « Canal GI » · sinon le nom d'un lieu existant ; un nom inconnu crée un nouveau lieu.</div>" +
            "</div>" +
          "</div></section>";
      }).join("");
    hydrateImages(main);
    try{ history.replaceState(null, "", "#" + canal.code); }catch(e){}
    if(keepScroll){
      window.scrollTo(0, scrollY);
    }else if(typeof sectionIndex === "number"){
      const target = document.getElementById("sec-" + sectionIndex);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    }else{
      window.scrollTo(0, 0);
    }
  }

  applyEdits();
  // nomenclature des merveilleux vaisseaux, toujours visible sous la liste des canaux
  nav.insertAdjacentHTML("beforeend", '<div class="sigle-legend"><b>▲</b> yáng · <b>▼</b> yīn<br><b>QM</b> qiāo mài<br><b>WM</b> wéi mài<br><b>ChM</b> chōng mài<br><b>DaiM</b> dài mài<br><span class="sopenkey">⚓\uFE0E</span> point d’ouverture<br><span class="sluokey">⛓\uFE0E</span> point luò<br><span class="sdistkey">⁝</span> canal distinct (pointillé fin)</div>');
  nav.insertAdjacentHTML("afterbegin", '<p class="check-legend">☑ = vérifié · <button type="button" id="toggleChecks" class="linkish">masquer</button></p>');
  const CHECKS_KEY = "mtc_trajets_hide_checks";
  const setChecks = hide => {
    document.body.classList.toggle("hide-checks", hide);
    const b = document.getElementById("toggleChecks");
    if(b) b.textContent = hide ? "afficher les cases" : "masquer";
    try{ localStorage.setItem(CHECKS_KEY, hide ? "1" : ""); }catch(e){}
  };
  setTimeout(() => {
    let hide = false;
    try{ hide = localStorage.getItem(CHECKS_KEY) === "1"; }catch(e){}
    setChecks(hide);
    document.getElementById("toggleChecks").addEventListener("click", () => setChecks(!document.body.classList.contains("hide-checks")));
  });
  data.forEach((c, i) => {
    if(i && c.kind === "vaisseau" && data[i - 1].kind !== "vaisseau"){
      const gap = document.createElement("div"); gap.className = "nav-gap"; nav.appendChild(gap);
    }
    const row = document.createElement("div");
    row.className = "navrow" + (edits.verified[c.code] ? " done" : "");
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = !!edits.verified[c.code]; box.title = "Vérifié";
    box.setAttribute("aria-label", "Vérifié : " + c.name);
    box.addEventListener("change", () => {
      if(box.checked) edits.verified[c.code] = true; else delete edits.verified[c.code];
      row.classList.toggle("done", box.checked);
      saveEdits();
    });
    const b = document.createElement("button");
    b.type = "button"; b.dataset.code = c.code;
    if(c.kind === "vaisseau") b.innerHTML = '<span class="full">' + esc(c.name.replace(/ — .*/, "").replace(/\s*\(.*$/, "")) + '</span><span class="short">' + esc(sigle(c.code)) + "</span>";
    else b.textContent = c.code;
    b.title = c.name;
    b.addEventListener("click", () => { if(view === "network") toggleNetCanal(c.code); else show(c.code); });
    row.append(box, b);
    nav.appendChild(row);
  });

  document.addEventListener("click", event => {
    const lab = editing && event.target.closest && event.target.closest(".plan .br-label");
    if(!lab) return;
    const sec = lab.closest("section"), si = Number(sec.id.replace("sec-", "")), bi = Number(lab.dataset.bi);
    const c = data.find(x => x.code === current), s = c.sections[si];
    if(s.type !== "principal") return;
    const key = c.code + "|" + si + "|" + bi;
    edits.internes = edits.internes || {};
    edits.internes[key] = !s.branches[bi].interne;
    saveEdits(); applyEdits(); show(current, undefined, true);
  });
  function complementClick(node){
    const cp = COMPLEMENTS.find(x => x.id === node.dataset.cp);
    if(!cp) return;
    if(editing){
      const label = (PLACES[cp.lieu] || {label:cp.lieu}).label;
      if(confirm("Valider « " + label + " » d'après l'illustration" + (cp.page ? " (p. " + cp.page + ")" : "") + " ?\n\nOK = valider · Annuler = autre choix")){
        edits.complements[cp.id] = "validé";
      }else if(confirm("Refuser ce complément (il disparaîtra du plan et des correspondances) ?")){
        edits.complements[cp.id] = "refusé";
      }else return;
      saveEdits(); applyEdits(); show(current, undefined, true);
      return;
    }
    // hors édition : montrer l'illustration de la section
    const img = node.closest("section") && node.closest("section").querySelector(".imgs img");
    if(img){
      const r = img.getBoundingClientRect();
      window.scrollBy({top:r.top - 90, behavior:"smooth"});
      img.style.outline = "3px solid #ffd84d";
      setTimeout(() => { img.style.outline = ""; }, 2500);
    }
  }
  // ---- clic sur une station : le texte défile jusqu'à la mention du lieu, surlignée ----
  const ZONE_RX = window.MTC_TRAJETS_RX || {};
  const PINYIN_OF = {P:"shǒu tài yīn", GI:"shǒu yáng míng", E:"z[úù] yáng míng", Rt:"z[úù] tài yīn", C:"shǒu sh[àǎ]o yīn",
    IG:"shǒu tài yáng", V:"z[úù] tài yáng", Rn:"z[úù] sh[àǎ]o yīn", EC:"shǒu jué yīn", TF:"shǒu sh[àǎ]o yáng",
    VB:"z[úù] sh[àǎ]o yáng", F:"z[úù] jué yīn", RM:"rèn mài", DM:"dū mài", CM:"chōng mài", DaiM:"dài mài",
    YinQ:"yīn qiāo mài", YangQ:"yáng qiāo mài", YinW:"yīn wéi mài", YangW:"yáng wéi mài"};
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function placeRegex(pid){
    const B = "(?<![\\p{L}\\p{N}_-])", A = "(?![\\p{L}\\p{N}_-])";
    let m = /^pt:(\S+) (\d+)$/.exec(pid);
    if(m) return new RegExp("(?<![\\p{L}\\p{N}])" + reEsc(m[1]) + "\\s?" + m[2] + "(?!\\d)", "gu");
    m = /^c:(\S+)$/.exec(pid);
    if(m) return new RegExp((PINYIN_OF[m[1]] ? PINYIN_OF[m[1]].replace(/ /g, "\\s+") + "|" : "") + "\\(canal[^()]*?" + reEsc(m[1]) + "\\)", "giu");
    if(ZONE_RX[pid]) return new RegExp(B + "(?:" + ZONE_RX[pid] + ")" + A, "giu");
    const label = (PLACES[pid] || {}).label;
    return label ? new RegExp(reEsc(label), "giu") : null;
  }
  // texte visible d'un paragraphe, sans les numéros d'appel de note, avec la position de chaque caractère
  function flatText(el){
    const map = [];
    let text = "";
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode:n => n.parentElement.closest("sup") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    for(let n = walker.nextNode(); n; n = walker.nextNode()){
      for(let i = 0; i < n.data.length; i++) map.push([n, i]);
      text += n.data;
    }
    return {text, map};
  }
  let mentionTimer = null;
  function clearMention(){
    if(window.CSS && CSS.highlights) CSS.highlights.delete("mtc-mention");
    document.querySelectorAll("mark.mtc-mention").forEach(mk => mk.replaceWith(...mk.childNodes));
  }
  function showMention(range){
    clearMention();
    if(window.CSS && CSS.highlights && window.Highlight){
      CSS.highlights.set("mtc-mention", new Highlight(range));
    }else{
      const mk = document.createElement("mark");
      mk.className = "mtc-mention";
      try{ range.surroundContents(mk); }catch(e){}
    }
    const r = range.getBoundingClientRect();
    window.scrollBy({top:r.top - window.innerHeight / 3, behavior:"smooth"});
    clearTimeout(mentionTimer);
    mentionTimer = setTimeout(clearMention, 8000);
  }
  function highlightMention(nodeEl){
    const sec = nodeEl.closest("section");
    if(!sec) return;
    const si = Number(sec.id.replace("sec-", ""));
    const canal = data.find(c => c.code === current);
    const s = canal && canal.sections[si];
    const b = s && s.branches[Number(nodeEl.dataset.bi)];
    const pid = nodeEl.dataset.pid, rx = placeRegex(pid);
    if(!b || !rx) return;
    // n-ième passage par ce lieu dans la branche → n-ième mention dans ses paragraphes
    const occ = b.places.slice(0, Number(nodeEl.dataset.idx)).filter(x => x === pid).length;
    let seen = 0, last = null;
    for(const pi of (b.ps || [b.p])){
      const el = sec.querySelector('[data-para="' + current + "|" + si + "|" + pi + '"]');
      if(!el) continue;
      const {text, map} = flatText(el);
      rx.lastIndex = 0;
      for(let m = rx.exec(text); m; m = rx.exec(text)){
        if(!m[0].length){ rx.lastIndex++; continue; }
        const range = document.createRange();
        const a = map[m.index], z = map[m.index + m[0].length - 1];
        range.setStart(a[0], a[1]); range.setEnd(z[0], z[1] + 1);
        last = range;
        if(seen++ === occ){ showMention(range); return; }
      }
    }
    if(last) showMention(last);   // numérotation décalée : dernière mention trouvée
  }

  document.addEventListener("click", event => {
    const node = event.target.closest(".node, .places-index button");
    if(node){
      // station du plan : seulement la mention dans le texte (le panneau cacherait la carte) ;
      // la liste complète des correspondances s'ouvre au double-clic
      if(RT && RT.phase === "play" && node.classList.contains("netstop")){ const lc = event.target.closest && event.target.closest("[data-line]"); rtClick(node.dataset.pid.slice(3), lc ? lc.dataset.line : null); return; }
      if(node.classList.contains("plain")){ openPointFiche(node.dataset.pid.slice(3)); return; }
      if(node.classList.contains("netstop")){ openCorr(corrKey(node.dataset.pid)); return; }
      if(node.dataset.cp){ complementClick(node); return; }
      if(node.classList.contains("node")) highlightMention(node);
      else openCorr(node.dataset.pid);
      return;
    }
    if(event.target.closest("[contenteditable='true'], textarea, input")) return;
    const row = event.target.closest("[data-go]");
    if(row){
      const [code, si] = row.dataset.go.split("|");
      show(code, Number(si));
    }
  });
  // enregistrement d'un paragraphe / d'une note quand on quitte le champ
  document.addEventListener("focusout", event => {
    const el = event.target;
    if(!(el instanceof HTMLElement) || !editing) return;
    if(el.dataset.para){
      const [code, si, pi] = el.dataset.para.split("|");
      const ci = data.findIndex(c => c.code === code);
      const text = (el.dataset.bullet ? "- " : "") + serializeEditable(el);
      if(text === ORIG.data[ci].sections[si].paragraphs[pi]) delete edits.paras[el.dataset.para]; else edits.paras[el.dataset.para] = text;
      el.classList.toggle("edited", el.dataset.para in edits.paras);
      saveEdits(); applyEdits();
    }else if(el.dataset.note){
      const [code, si, ni] = el.dataset.note.split("|");
      const ci = data.findIndex(c => c.code === code);
      const text = el.textContent.replace(/\s+/g, " ").trim();
      if(text === ORIG.data[ci].sections[si].notes[ni].text) delete edits.notes[el.dataset.note]; else edits.notes[el.dataset.note] = text;
      el.classList.toggle("edited", el.dataset.note in edits.notes);
      saveEdits(); applyEdits();
    }
  });
  document.addEventListener("change", event => {
    const el = event.target;
    if(el.dataset && el.dataset.branches){
      const lines = el.value.split(/\n+/).map(l => l.split(/\s*(?:→|->)\s*/).map(labelToPid).filter(Boolean)).filter(l => l.length);
      edits.branches[el.dataset.branches] = lines;
      saveEdits(); applyEdits(); show(current, undefined, true);
      if(corrPid && document.getElementById("corr").classList.contains("open")) openCorr(corrPid);
    }else if(el.id === "renameInput"){
      const pid = el.dataset.pid, label = el.value.trim();
      if(!label) return;
      if(ORIG.PLACES[pid] && ORIG.PLACES[pid].label === label && !String(pid).startsWith("u:")) delete edits.places[pid];
      else edits.places[pid] = {...(edits.places[pid] || {}), label};
      saveEdits(); applyEdits(); show(current, undefined, true); openCorr(pid);
    }
  });
  // « retirer » dans une liste de correspondances : enlève ce lieu du trajet
  document.addEventListener("click", event => {
    const b = event.target.closest(".rm");
    if(!b) return;
    event.stopPropagation();
    const [code, si] = b.dataset.rm.split("|");
    const s = data.find(c => c.code === code).sections[si];
    edits.branches[b.dataset.rm] = s.branches.map(br => br.places.filter(pid => pid !== corrPid)).filter(l => l.length);
    saveEdits(); applyEdits(); show(current, undefined, true); openCorr(corrPid);
  }, true);
  // survol d'un lieu du plan : les autres canaux qui passent par ce lieu
  const tip = document.getElementById("tip");
  // écran tactile : pas d'info-bulle (le toucher ouvre déjà les correspondances, et la bulle sortirait de l'écran)
  const noHover = () => { try{ return matchMedia("(hover: none)").matches; }catch(e){ return false; } };
  document.addEventListener("mouseover", event => {
    const node = event.target.closest && event.target.closest(".node");
    if(!node || noHover()){ tip.style.display = "none"; return; }
    const pid = node.dataset.pid;
    // tous les trajets qui passent ici, sauf celui qu'on regarde (les autres trajets du même
    // canal — tendineux, distinct… — restent listés)
    const sec = node.closest("section");
    const hereSi = sec ? Number(sec.id.replace("sec-", "")) : -1;
    const others = sectionsThrough(corrKey(pid)).filter(it => !(it.c.code === current && it.si === hereSi));
    const cp = node.dataset.cp && COMPLEMENTS.find(x => x.id === node.dataset.cp);
    tip.innerHTML = (cp ? '<span style="display:block;margin-bottom:5px;color:#6d6d85"><i>' + (cp.source ? "Selon la " + esc(cp.source) : "D\u2019après l\u2019illustration" + (cp.page ? " (p. " + cp.page + ")" : "")) +
        ", non cité dans le texte</i> — <b>" + esc(complementStatus(cp)) + "</b>" + (cp.note ? "<br>" + esc(cp.note) : "") +
        (editing && complementStatus(cp) !== "validé" ? "<br>Clic : valider ou refuser" : "") + "</span>" : "") +
      "<b>" + esc((PLACES[pid] || {label:pid}).label) + " — autres trajets" + (FAMILY_OF[pid] ? " (famille « " + esc(FAMILIES[FAMILY_OF[pid]].label) + " »)" : "") + "</b>" +
      (others.length ? others.map(rowHtml).join("") : '<span class="none">Aucun autre trajet ne passe ici.</span>') +
      '<span class="none" style="display:block;margin-top:5px;font-size:.72rem">Clic : voir dans le texte · double-clic : liste des correspondances</span>';
    tip.querySelectorAll(".rm").forEach(b => b.remove());
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", event => {
    if(tip.style.display !== "block") return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = event.clientX + 14, y = event.clientY + 14;
    if(x + w > innerWidth - 8) x = event.clientX - w - 14;
    if(y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    x = Math.max(8, Math.min(x, innerWidth - w - 8));     // toujours dans l'écran
    y = Math.max(8, y);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.getElementById("editToggle").addEventListener("click", () => {
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    const t = document.getElementById("editToggle");
    t.classList.toggle("on", editing); t.setAttribute("aria-pressed", editing);
    t.textContent = editing ? "✓ Terminer" : "✎ Modifier";
    show(current, undefined, true);
    if(corrPid && document.getElementById("corr").classList.contains("open")) openCorr(corrPid);
  });
  document.getElementById("exportEdits").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(edits, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "trajets-corrections-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById("importEdits").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if(!file) return;
    try{
      edits = Object.assign(emptyEdits(), JSON.parse(await file.text()));
      saveEdits(); applyEdits(); location.reload();
    }catch(e){ alert("Fichier de corrections illisible."); }
  });
  document.getElementById("resetEdits").addEventListener("click", () => {
    if(!confirm("Annuler toutes les corrections (textes, arrêts, noms de lieux) ? Les cases « vérifié » sont gardées.")) return;
    edits = {...emptyEdits(), verified:edits.verified};
    saveEdits(); applyEdits(); show(current, undefined, true);
  });
  updateEditCount();
  document.getElementById("typeToggle").addEventListener("click", e => {
    const h = e.target.closest("header"), on = h.classList.toggle("showtypes");
    e.target.setAttribute("aria-expanded", on); e.target.textContent = on ? "Types ▴" : "Types ▾";
  });
  document.querySelectorAll("#typeFilter input").forEach(box => {
    box.checked = TYPES_ON[box.dataset.type] !== false;
    box.addEventListener("change", () => {
      TYPES_ON[box.dataset.type] = box.checked;
      try{ localStorage.setItem(TYPES_KEY, JSON.stringify(TYPES_ON)); }catch(e){}
      if(view === "network") showNetwork(); else show(current, undefined, true);
      const corr = document.getElementById("corr");
      if(corr.classList.contains("open")){ if(corrPid) openCorr(corrPid); else openIndex(); }
    });
  });
  document.addEventListener("dblclick", event => {
    const node = event.target.closest(".node");
    if(node) openCorr(corrKey(node.dataset.pid));
  });
  document.getElementById("corrClose").addEventListener("click", () => { document.getElementById("corr").classList.remove("open"); corrStack = []; corrView = null; });
  document.getElementById("allPlaces").addEventListener("click", openIndex);
  document.addEventListener("keydown", e => { if(e.key === "Escape") document.getElementById("corr").classList.remove("open"); });

  document.getElementById("netToggle").addEventListener("click", () => { if(view === "network") show(lastCanal || (data[0] && data[0].code)); else showNetwork(); });
  if(location.hash === "#reseau") showNetwork();
  else if(location.hash === "#equilibrer") location.replace("../equilibrer/index.html");   // le jeu Équilibrer a sa propre page
  else if(location.hash === "#itineraire"){ showNetwork(); rtStart(); }
  else show(location.hash.slice(1) || (data[0] && data[0].code));
  // lien direct vers une liste de correspondances : index.html?lieu=yeux
  const lieu = new URLSearchParams(location.search).get("lieu");
  if(lieu && (PLACES[lieu] || PLACES["fam:" + lieu])) openCorr(PLACES["fam:" + lieu] ? "fam:" + lieu : lieu);
  })();
</script>
</body>
</html>
