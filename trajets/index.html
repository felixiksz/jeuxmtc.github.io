<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trajets des canaux</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff; --text:#111; --accent:#2b2bff; --muted:#666; --line:#9aa0c8; --zone:#ff8a3d; --organ:#e0457b; --point:#2b2bff; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:"Archivo", system-ui, sans-serif; line-height:1.5; }
  :root{ --navw:150px; }
  header{ position:sticky; top:0; background:var(--bg); border-bottom:1px solid #ddd; padding:10px 16px; z-index:3;
          margin-left:var(--navw); display:flex; align-items:center; gap:10px; }
  .beta{ font-size:.7em; color:var(--accent); font-weight:800; }
  h1{ font-size:1.1rem; margin:0; }
  nav{ position:fixed; top:0; left:0; bottom:0; width:var(--navw); box-sizing:border-box; overflow-y:auto; z-index:6;
       display:flex; flex-direction:column; gap:3px; padding:10px 8px; background:#f7f7fc; border-right:1px solid #ddd; }
  nav button, .tool{ font:inherit; font-weight:700; border:1px solid #ccd; background:#f5f5ff; border-radius:999px; padding:3px 11px; cursor:pointer; }
  nav button{ text-align:left; border-radius:8px; background:#fff; padding:3px 9px; font-size:.88rem; line-height:1.25; }
  nav button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  nav .nav-gap{ height:8px; flex:none; }
  .tool{ background:#fff; color:inherit; text-decoration:none; }
  .tool.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tools{ margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .typefilter{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.8rem; color:var(--muted); }
  .typefilter label{ display:inline-flex; align-items:center; gap:3px; cursor:pointer; white-space:nowrap; }
  .typefilter input{ margin:0; accent-color:var(--accent); }
  .edit-tools{ display:none; gap:6px; align-items:center; }
  body.editing .edit-tools{ display:flex; }
  .edit-count{ font-size:.78rem; color:var(--muted); }
  nav .navrow{ display:flex; align-items:center; gap:5px; }
  nav .navrow button{ flex:1; min-width:0; }
  nav .navrow input{ flex:none; margin:0; width:15px; height:15px; accent-color:#2f9a3c; cursor:pointer; }
  nav .navrow.done button:not(.on){ color:#2f9a3c; border-color:#9fd3a6; }
  body.hide-checks nav .navrow input{ display:none; }
  .linkish{ font:inherit; font-size:inherit; border:0; background:none; padding:0; color:var(--accent); text-decoration:underline; cursor:pointer; }
  .check-legend{ font-size:.68rem; color:var(--muted); margin:0 0 4px; line-height:1.2; }
  main{ margin:0 0 0 var(--navw); padding:16px 20px; }
  nav .short{ display:none; }
  .typetoggle{ display:none; }
  @media (max-width:700px){ :root{ --navw:64px; } nav{ padding:6px 4px; } nav .navrow{ gap:2px; } nav button{ font-size:.72rem; padding:3px 4px; }
    nav .full{ display:none; } nav .short{ display:inline; } .check-legend{ font-size:.6rem; } h1{ font-size:.95rem; }
    header{ padding:6px 8px; gap:6px; flex-wrap:wrap; }
    .typetoggle{ display:inline-block; } .typefilter{ display:none; width:100%; } header.showtypes .typefilter{ display:flex; }
    .edit-tools{ width:100%; } .typefilter{ font-size:.7rem; gap:2px 6px; } .tools .tool{ padding:2px 8px; font-size:.8rem; } }
  h2{ font-size:1.25rem; margin:8px 0 4px; }
  .src{ color:var(--muted); font-size:.8rem; margin-bottom:14px; }
  section{ border-top:1px solid #e3e3ee; padding:14px 0; scroll-margin-top:110px; }
  h3{ font-size:1rem; margin:0 0 8px; color:var(--accent); }
  p{ margin:0 0 8px; }
  .desc p, .desc li, details{ font-family:"Libre Baskerville", Georgia, serif; font-size:.9rem; line-height:1.7; }
  .typefilter, .edit-count, .legend{ font-family:"Tomorrow", "Archivo", sans-serif; }
  p.li{ padding-left:1.1em; text-indent:-1.1em; }
  p.li::before{ content:"• "; }
  body.editing [contenteditable="true"]{ outline:1px dashed #b9b9e6; border-radius:4px; background:#fffef4; }
  body.editing [contenteditable="true"]:focus{ outline:2px solid var(--accent); background:#fff; }
  .edited{ box-shadow:inset 3px 0 0 #f0a500; }
  .plancol{ min-width:0; }
  .stops-edit{ display:none; margin-top:8px; font-size:.78rem; color:var(--muted); }
  body.editing .stops-edit{ display:block; }
  .stops-edit textarea{ width:100%; box-sizing:border-box; min-height:110px; font:inherit; font-size:.8rem; color:var(--text); margin:3px 0; }
  .rename{ display:none; gap:6px; align-items:center; margin-bottom:10px; font-size:.85rem; }
  body.editing .rename{ display:flex; }
  .rename input{ flex:1; font:inherit; padding:3px 6px; }
  .crow .rm{ display:none; margin-left:auto; font:inherit; border:1px solid #e5b3b3; color:#b00; background:#fff; border-radius:999px; padding:0 8px; cursor:pointer; }
  body.editing .crow .rm{ display:inline-block; }
  sup a{ color:var(--accent); text-decoration:none; font-weight:700; font-size:.75em; }
  :root{ --canal:#8a3fd1; }
  .cols{ display:grid; grid-template-columns:minmax(260px, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap:18px; align-items:start; }
  .desc{ min-width:0; }
  .imgs{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .imgs img{ width:100%; height:auto; border:1px solid #eee; border-radius:8px; background:#fff; }
  @media (max-width:1100px){ .cols{ grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); } .cols .plancol{ grid-column:1 / -1; } }
  @media (max-width:760px){ .cols{ grid-template-columns:minmax(0, 1fr); } }
  .plan{ flex:0 1 auto; max-width:100%; min-width:200px; border:1px solid #e6e6f3; border-radius:10px; padding:8px 10px; background:#fbfbff; }
  .plan h4{ margin:0 0 4px; font-size:.85rem; color:var(--muted); }
  .plan-scroll{ overflow-x:auto; max-width:100%; }
  .plan svg{ display:block; }
  .zonepass .zlabel{ font-size:10px; font-style:italic; fill:#7a6f55; }
  .zonepass{ cursor:pointer; }
  .plan .br-label.int{ fill:#7d84b8; }
  body.editing .plan .br-label{ cursor:pointer; text-decoration:underline; }
  .plan .br-label{ font-size:10px; fill:var(--muted); font-weight:700; }
  .node{ cursor:pointer; }
  .node text{ font-size:10.5px; fill:#222; }
  .node text.xfer{ font-size:8.5px; font-weight:800; letter-spacing:.02em; }
  .node:hover circle, .node.sel circle{ stroke:#000; stroke-width:2.5; }
  .legend{ font-size:.72rem; color:var(--muted); display:flex; gap:12px; margin-top:4px; }
  .legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  details{ font-size:.82rem; color:#444; }
  details li{ margin-bottom:4px; scroll-margin-top:120px; }
  details li:target{ background:#fff6c8; }
  /* panneau des correspondances */
  #corr{ position:fixed; top:0; right:0; bottom:0; width:min(560px, calc(100vw - var(--navw))); background:#fff; border-left:1px solid #ddd;
         box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(105%); transition:transform .18s ease; z-index:5; display:flex; flex-direction:column; }
  #corr.open{ transform:none; }
  #corr header{ position:static; margin-left:0; display:flex; align-items:center; gap:8px; }
  #corr h2{ margin:0; font-size:1.05rem; }
  #corr .x{ margin-left:auto; font:inherit; font-size:1.3rem; border:0; background:none; cursor:pointer; }
  #corrBody{ overflow:auto; padding:10px 16px 20px; }
  .orb-gap{ flex:none; width:2.1em; }
  .crow{ display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:3px 6px; border-radius:8px; cursor:pointer; font-size:1rem; }
  .crow:hover{ background:#f3f3fa; }
  .cname{ font-weight:800; }
  .cname small{ font-weight:600; font-size:.72em; color:#777; -webkit-text-stroke:0; margin-left:.3em; }
  .el-terre{ color:#d9a400; }
  .el-bois{ color:#2f9a3c; }
  .el-feu{ color:#e0261b; }
  .el-eau{ color:#1f5fd6; }
  .el-metal{ color:#fff; -webkit-text-stroke:.7px #000; paint-order:stroke fill; }
  .el-none{ color:#222; }
  .orb{ flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:2.1em; height:2.1em; padding:0 .2em; box-sizing:border-box;
        border:2px solid currentColor; border-radius:999px; font-weight:800; font-size:.8rem; background:#fff; }
  .orb.el-metal{ color:#000; -webkit-text-stroke:0; }
  .cgap{ height:10px; }
  .crow .where{ flex:none; width:8.5em; font-size:.72rem; font-weight:700; color:#555; background:#f1f1f7; border-radius:6px; padding:1px 6px; line-height:1.25; }
  nav .navrow.muted button{ opacity:.38; background:#eee; text-decoration:line-through; }
  .tgroup{ display:inline-flex; gap:6px; align-items:center; padding:1px 7px; border:1px solid #d7d7e6; border-radius:999px; }
  .netwrap{ background:#f4f1ea; }
  .qcell{ stroke:none; }
  .facelabel{ font-size:34px; font-weight:800; fill:#b4ab97; letter-spacing:.2em; pointer-events:none; }
  .casing{ stroke:#ffffff; pointer-events:none; }
  .netwrap.dark .casing{ stroke:#171a22; }
  .subq rect{ fill:#ffffff; fill-opacity:.28; stroke:#ffffff; stroke-opacity:.8; stroke-dasharray:6 5; }
  .subq text{ font-size:11px; font-weight:800; fill:#8f8878; letter-spacing:.06em; text-transform:uppercase; }
  .rivername{ font-family:"Libre Baskerville", Georgia, serif; font-style:italic; font-size:12px; fill:#2f6b9f; letter-spacing:.12em; paint-order:stroke; stroke:#eaf4fb; stroke-width:3px; pointer-events:none; }
  .rivername.rm{ fill:#b0527c; stroke:#fbe6ef; }
  .rivername.big{ font-size:16px; font-weight:700; }
  .terminus text{ font-size:11px; font-weight:800; }
  .netstop .cat{ font-size:10px; fill:#1f4e79; }
  .pier .anchor{ font-size:11px; font-weight:800; fill:#1f4e79; paint-order:stroke; stroke:#fff; stroke-width:3px; }
  body.editing .netstop{ cursor:move; }
  .qborder{ stroke:#ffffff; stroke-width:5; stroke-linejoin:round; }
  .qlabel{ font-size:15px; font-weight:800; fill:#9c9483; letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
  .qlabel.downtown{ fill:#b0755c; }
  .netjoint{ pointer-events:none; }
  .netjoint text{ font-size:12px; font-weight:800; fill:#5b574f; paint-order:stroke; stroke:#fff; stroke-width:4px; letter-spacing:.05em; text-transform:uppercase; }
  .netwrap.dark .qcell{ fill-opacity:.12; }
  .netwrap.dark .qborder{ stroke:#2a2f3b; }
  .netwrap.dark .qlabel{ fill:#6f7686; }
  .netwrap.dark .rivername{ stroke:#171a22; fill:#8cc3ec; }
  .netwrap.dark .netstop .cat{ fill:#9cc9ee; }
  .netwrap.dark .netjoint circle{ fill:#171a22; }
  .netwrap.dark .netjoint text{ fill:#cfd3dc; stroke:#171a22; }
  .netwrap.dark{ background:#171a22; border-color:#2a2f3b; }
  .netwrap.dark .quartier rect{ fill-opacity:.09; stroke:#3a4150; }
  .netwrap.dark .quartier text{ fill:#8c93a3; }
  .netwrap.dark .netstop circle{ fill:#171a22; stroke:#f2f2f2; }
  .netwrap.dark .netstop text{ fill:#eef0f4; stroke:#171a22; }
  .netwrap.dark .netstop text.small{ fill:#aab0bd; }
  .netwrap.dark .netbadge circle{ fill:#171a22; }
  .netwrap.dark .netbadge text{ fill:#fff; }
  .netwrap.dark .joint rect{ fill:#fff; fill-opacity:.05; }
  .netwrap.dark .joint text{ fill:#6f7686; }
  .netinfo{ margin:0 0 6px; font-size:.85rem; }
  .netinfo summary{ cursor:pointer; color:var(--accent); font-weight:700; }
  @media (max-width:760px){
    main{ padding:8px 8px 8px 10px; }
    main h2{ font-size:1rem; margin:2px 0 4px; }
    .netwrap{ height:calc(100vh - 120px) !important; }
    .netzoom button{ width:38px; height:38px; }
  }
  .netwrap{ position:relative; border:1px solid #e6e6f3; border-radius:12px; background:#fff; height:calc(100vh - 200px); min-height:420px; overflow:hidden; }
  .netsvg{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; user-select:none; }
  .netsvg.dragging{ cursor:grabbing; }
  .netzoom{ position:absolute; right:10px; top:10px; z-index:2; display:flex; flex-direction:column; gap:4px; }
  .netzoom button{ font:inherit; font-weight:800; width:32px; height:32px; border:1px solid #ccd; border-radius:8px; background:#fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .joint text{ font-size:11px; font-weight:800; fill:#9a96a8; letter-spacing:.04em; text-transform:uppercase; }
  .quartier text{ font-size:15px; font-weight:800; fill:#a39d8c; letter-spacing:.03em; }
  .netstop text.small{ font-size:8px; font-weight:600; fill:#666; }
  .netstop{ cursor:pointer; }
  .netstop text{ font-size:10.5px; font-weight:800; fill:#222; paint-order:stroke; stroke:#fff; stroke-width:3.5px; }
  .netstop:hover rect, .netstop:hover circle{ stroke:#000; stroke-width:2.6; }
  .netbadge text{ font-size:8px; font-weight:800; fill:#222; }
  .netline:hover{ stroke-width:6; }
  .netlegend{ flex-wrap:wrap; margin:0 0 8px; align-items:center; }
  .netlegend svg{ vertical-align:middle; margin-right:4px; }
  .crow small.jh{ font-size:.68rem; color:#8a6d00; background:#fff6d6; border-radius:999px; padding:0 6px; white-space:nowrap; }
  ::highlight(mtc-mention){ background-color:#ffd84d; color:#000; }
  mark.mtc-mention{ background:#ffd84d; color:#000; border-radius:3px; }
  /* survol d'un lieu du plan : autres canaux qui y passent */
  #tip{ position:fixed; z-index:20; pointer-events:none; max-width:340px; background:#fff; border:1px solid #d6d6ea; border-radius:10px;
        box-shadow:0 6px 20px rgba(0,0,0,.14); padding:8px 10px; font-size:.82rem; display:none; }
  #tip b{ display:block; margin-bottom:4px; }
  #tip .crow{ font-size:.85rem; padding:1px 0; cursor:default; }
  #tip .orb{ font-size:.68rem; }
  #tip .none{ color:var(--muted); }
  .places-index h3{ margin:14px 0 4px; color:var(--text); font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; }
  .places-index button{ font:inherit; font-size:.85rem; border:1px solid #dde; background:#fafaff; border-radius:999px; padding:1px 9px; margin:2px; cursor:pointer; }
</style>
</head>
<body>
<nav id="nav" aria-label="Canaux"></nav>
<header>
  <a class="tool" href="../index.html?admin=1" title="Retour au jeu">← Jeu</a>
  <h1>Trajets des canaux <sup class="beta" title="Version bêta">β</sup></h1>
  <button type="button" class="tool typetoggle" id="typeToggle" aria-expanded="false">Types ▾</button>
  <div class="typefilter" id="typeFilter" role="group" aria-label="Types de trajets affichés">
    <span class="tgroup">régulier : <label title="Seules les branches externes ont des points d'acupuncture"><input type="checkbox" data-type="externe"> branches externes</label>
      <label title="Branches internes (nommées ainsi dans le texte, ou déduites)"><input type="checkbox" data-type="interne"> branches internes</label></span>
    <label><input type="checkbox" data-type="luo"> luo</label>
    <label><input type="checkbox" data-type="distinct"> distinct</label>
    <label><input type="checkbox" data-type="tendineux"> tendineux</label>
    <label><input type="checkbox" data-type="vaisseau"> merveilleux vaisseaux</label>
  </div>
  <div class="tools">
    <span class="edit-tools">
      <span class="edit-count" id="editCount"></span>
      <button type="button" class="tool" id="exportEdits" title="Télécharger un fichier de sauvegarde de toutes tes corrections">Exporter</button>
      <button type="button" class="tool" id="importEdits" title="Recharger un fichier de corrections exporté">Importer</button>
      <button type="button" class="tool" id="resetEdits" title="Revenir au texte d'origine (les cases « vérifié » restent)">Tout annuler</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </span>
    <button type="button" class="tool" id="editToggle" aria-pressed="false">✎ Modifier</button>
    <button type="button" class="tool" id="netToggle">Réseau global</button>
    <button type="button" class="tool" id="allPlaces">Correspondances…</button>
  </div>
</header>
<main id="main"></main>
<aside id="corr" aria-hidden="true">
  <header><h2 id="corrTitle"></h2><button type="button" class="x" id="corrClose" aria-label="Fermer">×</button></header>
  <div id="corrBody"></div>
</aside>
<div id="tip" role="tooltip"></div>
<script>
  // accès admin seulement (lien proposé dans le jeu avec ?admin=1)
  let __admin = new URLSearchParams(location.search).get("admin") === "1";
  try{ if(__admin) localStorage.setItem("mtc_admin", "1"); __admin = __admin || localStorage.getItem("mtc_admin") === "1"; }catch(e){}
  if(!__admin){
    document.body.innerHTML = '<p style="padding:24px;font-family:system-ui,sans-serif">Page réservée.</p>';
    throw new Error("trajets : accès admin requis");
  }
  (async () => {
  // ---- données : fichiers locaux (copie de travail) sinon dépôt GitHub PRIVÉ de la synchro ----
  // Les textes et images du cours ne sont pas sur le site public : la page les lit dans le
  // dépôt privé configuré dans la synchro GitHub du jeu (même navigateur), avec son token.
  const PRIVATE_DIR = "trajets";
  let dataMode = "local";
  function loadScript(src){
    return new Promise(resolve => {
      const s = document.createElement("script");
      s.src = src; s.onload = () => resolve(true); s.onerror = () => { s.remove(); resolve(false); };
      document.head.appendChild(s);
    });
  }
  function syncCfg(){
    const g = k => { try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } };
    return {token:g("mtc_github_sync_token"), owner:g("mtc_github_sync_owner"), repo:g("mtc_github_sync_repo"), branch:g("mtc_github_sync_branch") || "main"};
  }
  async function privateFetch(path){
    const c = syncCfg();
    const url = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) +
      "/contents/" + path.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(c.branch);
    const r = await fetch(url, {headers:{Authorization:"Bearer " + c.token, Accept:"application/vnd.github.raw"}, cache:"no-store"});
    if(!r.ok) throw new Error("GitHub " + r.status + " pour " + path);
    return r;
  }
  async function loadTrajetsData(){
    if(await loadScript("trajets-data.js")){
      await loadScript("trajets-places-rx.js");
      await loadScript("trajets-complements.js");
      await loadScript("trajets-jiaohui.js");
      await loadScript("trajets-point-zones.js");
      return;
    }
    const c = syncCfg();
    if(!(c.token && c.owner && c.repo)) throw new Error("Synchro GitHub non configurée dans ce navigateur.");
    dataMode = "private";
    const code = await (await privateFetch(PRIVATE_DIR + "/trajets-data.js")).text();
    new Function(code)();
    try{ new Function(await (await privateFetch(PRIVATE_DIR + "/trajets-places-rx.js")).text())(); }catch(e){}
    try{ new Function(await (await privateFetch(PRIVATE_DIR + "/trajets-complements.js")).text())(); }catch(e){}
    try{ new Function(await (await privateFetch(PRIVATE_DIR + "/trajets-jiaohui.js")).text())(); }catch(e){}
    try{ new Function(await (await privateFetch(PRIVATE_DIR + "/trajets-point-zones.js")).text())(); }catch(e){}
  }
  // images : directes en local, lues dans le dépôt privé sinon
  const imageCache = new Map();
  function hydrateImages(root){
    root.querySelectorAll("img[data-src]").forEach(img => {
      const src = img.dataset.src;
      img.removeAttribute("data-src");
      if(dataMode === "local"){ img.src = src; return; }
      if(!imageCache.has(src)) imageCache.set(src, privateFetch(PRIVATE_DIR + "/" + src).then(r => r.blob()).then(b => URL.createObjectURL(b)));
      imageCache.get(src).then(url => { img.src = url; }).catch(() => { img.alt = "image indisponible"; });
    });
  }
  try{
    await loadTrajetsData();
  }catch(error){
    document.getElementById("main").innerHTML = '<p style="max-width:560px">Les trajets sont gardés dans ton dépôt GitHub privé. ' +
      "Ouvre d'abord le jeu dans ce navigateur et configure la synchro GitHub (token, propriétaire, dépôt), puis reviens ici.</p>" +
      '<p style="color:#888;font-size:.85rem">' + String(error.message || error).replace(/[<>&]/g, "") + "</p>";
    return;
  }
  const data = window.MTC_TRAJETS || [];
  const PLACES = window.MTC_TRAJETS_PLACES || {};
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // ---- corrections faites dans la page (gardées dans ce navigateur, exportables) ----
  const EDIT_KEY = "mtc_trajets_edits_v1";
  const ORIG = JSON.parse(JSON.stringify({data, PLACES}));
  const emptyEdits = () => ({paras:{}, notes:{}, branches:{}, places:{}, verified:{}, complements:{}, internes:{}, stationPos:{}, pointZone:{}});
  let edits = loadEdits();
  let editing = false;
  function loadEdits(){
    try{ return Object.assign(emptyEdits(), JSON.parse(localStorage.getItem(EDIT_KEY) || "{}")); }catch(e){ return emptyEdits(); }
  }
  function saveEdits(){
    try{ localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); }catch(e){}
    updateEditCount();
  }
  function updateEditCount(){
    const n = Object.keys(edits.paras).length + Object.keys(edits.notes).length + Object.keys(edits.branches).length + Object.keys(edits.places).length + Object.keys(edits.complements || {}).length;
    const el = document.getElementById("editCount");
    if(el) el.textContent = n ? n + " correction" + (n > 1 ? "s" : "") : "aucune correction";
  }
  // ---- compléments d'après l'illustration (lieux montrés par l'image, non cités dans le texte) ----
  const COMPLEMENTS = window.MTC_TRAJETS_COMPLEMENTS || [];
  const complementStatus = cp => (edits.complements || {})[cp.id] || cp.statut || "à valider";
  function applyComplements(c, s){
    COMPLEMENTS.filter(cp => cp.canal === c.code && cp.section === s.type).forEach(cp => {
      if(complementStatus(cp) === "refusé") return;
      // repère souple : « malleole » reconnaît aussi « malleole-ext », « front » « angle-frontal »…
      const anchor = cp.avant || cp.apres;
      const findAnchor = places => {
        if(!anchor) return -1;
        const exact = places.indexOf(anchor);
        return exact >= 0 ? exact : places.findIndex(pid => !anchor.includes(":") && pid.includes(anchor));
      };
      const candidates = s.branches.filter(br => (br.ps || [br.p]).some(pi => (s.paragraphs[pi] || "").includes(cp.branche)));
      const b = candidates.find(br => findAnchor(br.places) >= 0) || candidates[0];
      if(!b) return;
      const ai = findAnchor(b.places);
      let at = b.places.length;
      if(ai >= 0) at = cp.avant ? ai : ai + 1;
      else if(cp.debut) at = 0;
      b.places.splice(at, 0, cp.lieu);
      b.img.splice(at, 0, cp);
    });
  }
  // Branche interne / externe (canaux réguliers) : d'abord ce que dit le texte (« une branche
  // interne… », « dans l'interne », « le trajet externe… ») ; sinon déduit : une branche qui passe
  // surtout par des organes et des structures profondes, sans point de son propre canal.
  const DEEP = new Set(["oculaire", "cerveau", "nasopharynx", "diaphragme", "cavite-corp", "foyer-central", "trachee"]);
  function classifyBranch(c, s, si, b, bi){
    const key = c.code + "|" + si + "|" + bi;
    if(edits.internes && key in edits.internes){ b.interne = edits.internes[key]; b.interneSrc = "corrigé"; return; }
    const txt = (s.paragraphs[b.p] || "").replace(/^-\s*/, "");
    const first = txt.split(/[.;:](?:\s|$)/)[0];
    if(/^(?:[^.;:]{0,90}?[\s,])?(?<!par\s)(?:la|une)\s+branche\s+interne\b/i.test(first) || /dans\s+l[’']interne/i.test(first)){ b.interne = true; b.interneSrc = "texte"; return; }
    if(/^(?:[^.;:]{0,90}?[\s,])?(?:le\s+|la\s+)?(?:trajet|branche)\s+externe\b/i.test(first)){ b.interne = false; b.interneSrc = "texte"; return; }
    const ps = b.places.filter(pid => !pid.startsWith("c:"));
    const own = ps.slice(1, -1).filter(pid => pid.startsWith("pt:" + c.code + " ")).length;
    const deep = ps.filter(pid => DEEP.has(pid) || (PLACES[pid] || ORIG.PLACES[pid] || {}).group === "organes").length;
    const surf = ps.filter(pid => !pid.startsWith("pt:") && !(DEEP.has(pid) || (PLACES[pid] || ORIG.PLACES[pid] || {}).group === "organes")).length;
    b.interne = own === 0 && deep > 0 && deep >= surf;
    b.interneSrc = "déduit";
  }
  const branchShown = (s, b) => s.type !== "principal" ? true : (b.interne ? TYPES_ON.interne !== false : TYPES_ON.externe !== false);
  function applyEdits(){
    data.forEach((c, ci) => c.sections.forEach((s, si) => {
      const o = ORIG.data[ci].sections[si];
      s.paragraphs = o.paragraphs.map((p, pi) => edits.paras[c.code + "|" + si + "|" + pi] ?? p);
      s.notes = o.notes.map((n, ni) => ({...n, text:edits.notes[c.code + "|" + si + "|" + ni] ?? n.text}));
      const eb = edits.branches[c.code + "|" + si];
      s.branches = eb ? eb.map((places, bi) => ({...(o.branches[bi] || {}), places:places.slice()}))
                      : (o.branches || []).map(b => ({...b, places:b.places.slice()}));
      s.branches.forEach(b => { b.img = b.places.map(() => null); });
      if(!eb) applyComplements(c, s);
      if(s.type === "principal") s.branches.forEach((b, bi) => classifyBranch(c, s, si, b, bi));   // arrêts retouchés à la main : ta version prime
    }));
    Object.keys(PLACES).forEach(k => delete PLACES[k]);
    Object.assign(PLACES, JSON.parse(JSON.stringify(ORIG.PLACES)));
    Object.entries(edits.places).forEach(([pid, v]) => { PLACES[pid] = {...(PLACES[pid] || {group:"ajoutés"}), ...v}; });
    // lieux ajoutés par les compléments (point cité seulement sur l'image, ex. E 32)
    Object.entries(FAMILIES).forEach(([fid, f]) => { PLACES[fid] = {label:f.label, group:"familles"}; });
    COMPLEMENTS.forEach(cp => {
      if(!PLACES[cp.lieu]) PLACES[cp.lieu] = {label:cp.lieu.replace(/^pt:/, ""), group:cp.lieu.startsWith("pt:") ? "points" : "ajoutés"};
    });
  }
  // texte d'un paragraphe modifié : les appels de note redeviennent [[nN]]
  function serializeEditable(el){
    const clone = el.cloneNode(true);
    clone.querySelectorAll("sup").forEach(sup => sup.replaceWith("[[n" + sup.textContent.trim() + "]]"));
    return clone.textContent.replace(/\s+/g, " ").trim();
  }
  const CODE_CASE = {rm:"RM", dm:"DM", gi:"GI", ig:"IG", rt:"Rt", rn:"Rn", ec:"EC", tf:"TF", vb:"VB", p:"P", e:"E", c:"C", v:"V", f:"F"};
  const normLabel = x => x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  function addPlace(pid, info){ PLACES[pid] = info; edits.places[pid] = {...(edits.places[pid] || {}), ...info}; }
  // nom d'arrêt tapé → lieu : « Rt 4 » (point), « Canal GI », un lieu existant, sinon un nouveau lieu
  function labelToPid(label){
    const L = label.trim();
    if(!L) return null;
    let m = /^(rm|dm|gi|ig|rt|rn|ec|tf|vb|p|e|c|v|f)\s*(\d{1,2})$/i.exec(L);
    if(m){
      const code = CODE_CASE[m[1].toLowerCase()], lab = code + " " + Number(m[2]), pid = "pt:" + lab;
      if(!PLACES[pid]) addPlace(pid, {label:lab, group:"points"});
      return pid;
    }
    m = /^canal\s+(\S+)$/i.exec(L);
    if(m && CODE_CASE[m[1].toLowerCase()]){
      const code = CODE_CASE[m[1].toLowerCase()], pid = "c:" + code;
      if(!PLACES[pid]) addPlace(pid, {label:"Canal " + code, group:"canaux"});
      return pid;
    }
    const n = normLabel(L);
    const hit = Object.keys(PLACES).find(pid => normLabel(PLACES[pid].label) === n);
    if(hit) return hit;
    const pid = "u:" + n.replace(/[^a-z0-9]+/g, "-");
    addPlace(pid, {label:L, group:"ajoutés"});
    return pid;
  }
  const withRefs = (text, key) => esc(text).replace(/\[\[n(\d+)\]\]/g, (m, n) => '<sup><a href="#' + key + '-n' + n + '">' + n + "</a></sup>");

  // Noms des canaux pour les listes de correspondances
  const CANAL = {
    P:{limb:"Shǒu", layer:"TÀI YĪN", organ:"POUMON", de:"du"},
    GI:{limb:"Shǒu", layer:"YÁNG MÍNG", organ:"GROS INTESTIN", de:"du"},
    E:{limb:"Zù", layer:"YÁNG MÍNG", organ:"ESTOMAC", de:"de l’"},
    Rt:{limb:"Zù", layer:"TÀI YĪN", organ:"RATE", de:"de la"},
    C:{limb:"Shǒu", layer:"SHÀO YĪN", organ:"CŒUR", de:"du"},
    IG:{limb:"Shǒu", layer:"TÀI YÁNG", organ:"INTESTIN GRÊLE", de:"de l’"},
    V:{limb:"Zù", layer:"TÀI YÁNG", organ:"VESSIE", de:"de la"},
    Rn:{limb:"Zù", layer:"SHÀO YĪN", organ:"REINS", de:"des"},
    EC:{limb:"Shǒu", layer:"JUÉ YĪN", organ:"ENVELOPPE DU CŒUR", de:"de l’"},
    TF:{limb:"Shǒu", layer:"SHÀO YÁNG", organ:"TROIS FOYERS", de:"du"},
    VB:{limb:"Zù", layer:"SHÀO YÁNG", organ:"VÉSICULE BILIAIRE", de:"de la"},
    F:{limb:"Zù", layer:"JUÉ YĪN", organ:"FOIE", de:"du"}
  };
  const TYPE = {
    principal:["zhèng jīng", "Canal régulier"], luo:["luò mài", "Vaisseau liaison"], grand_luo:["dà luò", "Grand vaisseau liaison"],
    distinct:["jīng bié", "Canal distinct"], tendineux:["jīng jīn", "Canal tendineux"], vaisseau:["", ""]
  };
  const TYPE_ORDER = ["principal", "luo", "grand_luo", "distinct", "tendineux", "vaisseau"];
  // regroupement par couche (comme les listes du cours), puis les merveilleux vaisseaux
  const CANAL_ORDER = ["P", "Rt", "GI", "E", "C", "Rn", "IG", "V", "EC", "F", "TF", "VB", "DM", "RM", "CM", "YangQ", "YinQ", "YangW", "YinW", "DaiM"];
  const LAYER_OF = code => CANAL[code] ? CANAL[code].layer : code;

  // ---- familles de lieux : les plans restent au mot près, mais les listes de correspondances
  // regroupent les lieux voisins (« Yeux » = œil, canthus, paupières, orbite…) ----
  // Pas de famille aux extrémités (main, poignet, coude, jambe, malléoles, pied, orteils) : là, le
  // côté et l'os comptent (bord interne du 1er métatarsien ≠ entre 1er et 2e métatarsiens), et ce
  // sont les points qui donnent le passage exact des canaux principaux.
  const FAMILIES = {
    "fam:yeux":{label:"Yeux (tout l’œil)", members:["yeux", "oculaire", "canthus-int", "canthus-ext", "paupiere-inf", "paupiere-sup", "orbite", "sous-orbitaire", "sus-orbitaire"]},
    "fam:oreille":{label:"Oreille (tout autour)", members:["oreille", "devant-oreille", "derriere-oreille", "autour-oreille", "dessus-oreille", "apex-oreille", "supant-oreille"]},
    "fam:nez":{label:"Nez (tout le nez)", members:["nez", "aile-nez", "racine-nez", "arriere-nez"]},
    "fam:bouche":{label:"Bouche et lèvres", members:["bouche", "levres", "frein-levre", "gouttiere"]},
    "fam:dents":{label:"Dents et gencives", members:["dents", "gencive-inf", "gencive-sup"]},
    "fam:machoire":{label:"Mâchoire et mandibule", members:["machoire", "mandibule", "angle-mandibule"]},
    "fam:front":{label:"Front", members:["front", "angle-frontal", "cheveux"]},
    "fam:tempe":{label:"Tempe", members:["tempe", "angle-temporal"]},
    "fam:pommette":{label:"Pommette", members:["pommette", "arcade-zyg", "region-zyg"]},
    "fam:sommet":{label:"Sommet de la tête", members:["vertex", "parietal"]},
    "fam:thorax":{label:"Thorax et poitrine", members:["thorax", "poitrine", "thorax-lat"]},
    "fam:cotes":{label:"Côtes", members:["cotes", "cotes-flott", "intercostal"]},
    "fam:seins":{label:"Seins et mamelons", members:["seins", "mamelon"]},
    "fam:abdomen":{label:"Abdomen", members:["abdomen", "abdomen-inf"]},
    "fam:colonne":{label:"Colonne vertébrale", members:["colonne", "vertebres", "lombaires"]},
    "fam:pubis":{label:"Pubis", members:["pubis", "symphyse"]},
    "fam:genitaux":{label:"Organes génitaux", members:["genitaux", "verge", "uretre"]},
    "fam:epaule":{label:"Épaule", members:["epaule", "acromion"]},
    "fam:omoplate":{label:"Omoplate (scapula)", members:["omoplate", "supraep", "infraep"]},
    "fam:clavicule":{label:"Clavicule", members:["clavicule", "zone-clav"]},
    "fam:aisselle":{label:"Aisselle", members:["aisselle", "pli-axill"]},
    "fam:hanche":{label:"Hanche", members:["hanche", "trochanter", "coxo"]},
    "fam:coeur":{label:"Cœur (et système du cœur)", members:["o-coeur", "o-systeme-coeur"]},
    "fam:poumon":{label:"Poumon (et système pulmonaire)", members:["o-poumon", "o-systeme-poumon"]}
  };
  const FAMILY_OF = {};
  Object.entries(FAMILIES).forEach(([fid, f]) => f.members.forEach(m => { FAMILY_OF[m] = fid; }));
  const membersOf = pid => FAMILIES[pid] ? FAMILIES[pid].members : [pid];
  // lieu à utiliser pour les correspondances d'un arrêt : sa famille s'il en a une
  const corrKey = pid => FAMILY_OF[pid] || pid;

  // types de trajets affichés (cases en haut) : plans et correspondances
  const TYPES_KEY = "mtc_trajets_types_v1";
  const typeGroup = type => (type === "grand_luo" ? "luo" : type);
  let TYPES_ON = {externe:true, luo:true, distinct:true, tendineux:true, vaisseau:true, interne:true};
  try{ Object.assign(TYPES_ON, JSON.parse(localStorage.getItem(TYPES_KEY) || "{}")); }catch(e){}
  // …&types=externe,luo dans l'adresse : types affichés pour cette vue (sans toucher aux réglages enregistrés)
  const typesQ = new URLSearchParams(location.search).get("types");
  if(typesQ){ const on = typesQ.split(","); Object.keys(TYPES_ON).forEach(k => { TYPES_ON[k] = on.includes(k); }); }
  const typeShown = s => s.type === "principal" ? (TYPES_ON.externe !== false || TYPES_ON.interne !== false) : TYPES_ON[typeGroup(s.type)] !== false;

  const JIAOHUI = window.MTC_TRAJETS_JIAOHUI || {};
  function sectionsThrough(pid){
    const ms = membersOf(pid);
    const out = [];
    data.forEach(c => c.sections.forEach((s, si) => {
      if(s.branches && s.branches.some(b => branchShown(s, b) && b.places.some(p => ms.includes(p)))) out.push({c, s, si});
    }));
    // un point appartient par définition au canal régulier de son code (VB 8 → canal VB),
    // même si le texte de ce trajet ne le cite pas
    const pm = /^pt:(\S+) \d+$/.exec(pid);
    const own = pm && TYPES_ON.externe !== false && data.find(c => c.code === pm[1]);
    if(own){
      const si = own.sections.findIndex(s => s.type === "principal");
      if(si >= 0 && !out.some(o => o.c === own && o.si === si)) out.push({c:own, s:own.sections[si], si});
    }
    // zone : les points placés dans son quartier sur le plan (ex. RM 2 derrière le pubis)
    if(!pm && typeof zoneQuartier === "function"){
      const quarts = new Set(ms.map(z => zoneQuartier(z)).filter(Boolean));
      Object.entries(pointZones()).forEach(([pt, q]) => {
        if(!quarts.has(q)) return;
        const code = pt.slice(3).split(" ")[0], c = data.find(x => x.code === code);
        if(!c) return;
        c.sections.forEach((s, si) => {
          const passes = s.type === "principal" || (s.branches || []).some(b => b.places.includes(pt));
          if(!passes) return;
          const had = out.find(o => o.c === c && o.si === si);
          const via = (PLACES[pt] || {label:pt.slice(3)}).label + " (placé dans ce quartier)";
          if(had) had.via = had.via || via; else out.push({c, s, si, via});
        });
      });
    }
    // point d'intersection (jiāo huì) : les canaux du tableau s'y rejoignent (gris = selon certains auteurs)
    const jh = pm && TYPES_ON.externe !== false && JIAOHUI[pid.slice(3)];
    if(jh){
      [["canaux", false], ["certains", true]].forEach(([k, certain]) => (jh[k] || []).forEach(code => {
        const c = data.find(x => x.code === code);
        if(!c) return;
        const si = c.sections.findIndex(s => s.type === "principal" || s.type === "vaisseau");
        if(si < 0) return;
        const had = out.find(o => o.c === c && o.si === si);
        if(had) had.jh = true;
        else out.push({c, s:c.sections[si], si, jh:true, certain});
      }));
    }
    out.sort((a, b) => (CANAL_ORDER.indexOf(a.c.code) - CANAL_ORDER.indexOf(b.c.code)) || (TYPE_ORDER.indexOf(a.s.type) - TYPE_ORDER.indexOf(b.s.type)));
    return out.filter(it => typeShown(it.s));
  }

  // Couleur de l'élément : terre (Rt, E) jaune, bois (F, VB) vert, feu (C, IG, EC, TF) rouge,
  // métal (P, GI) blanc cerné de noir, eau (Rn, V) bleu.
  const ELEMENT = {Rt:"terre", E:"terre", F:"bois", VB:"bois", C:"feu", IG:"feu", EC:"feu", TF:"feu", P:"metal", GI:"metal", Rn:"eau", V:"eau"};

  function rowHtml(item){
    const {c, s, si} = item;
    const where = item.where ? '<span class="where" title="Lieu de correspondance">' + esc(item.where) + "</span>" : "";
    const go = ' data-go="' + c.code + "|" + si + '"';
    const meta = CANAL[c.code];
    const orb = code => '<span class="orb el-' + (ELEMENT[code] || "none") + '">' + esc(code) + "</span>";
    const rmBtn = (item.jh ? '<small class="jh">' + (item.certain ? "intersection, selon certains auteurs" : "point d’intersection") + "</small>" : "") +
      '<button type="button" class="rm" data-rm="' + c.code + "|" + si + '" title="Retirer ce lieu de ce trajet">retirer</button>';
    if(!meta){
      const name = c.name.replace(/ — .*/, "") + (s.type === "luo" ? " luò mài" : "");
      return '<div class="crow"' + go + ">" + where + ((c.code === "RM" || c.code === "DM") ? orb(c.code) : '<span class="orb-gap"></span>') +
        '<span class="cname el-none">' + esc(name) + "</span>" + rmBtn + "</div>";
    }
    const t = TYPE[s.type] || ["", ""];
    const name = meta.limb + " " + meta.layer.toLowerCase() + " " + t[0];
    return '<div class="crow"' + go + ">" + where + orb(c.code) + '<span class="cname el-' + ELEMENT[c.code] + '">' + esc(name) +
      ' <small>' + esc(t[1].toLowerCase()) + "</small></span>" + rmBtn + "</div>";
  }

  let corrPid = null;
  function openCorr(pid){
    const place = PLACES[pid] || {label:pid};
    const items = sectionsThrough(pid);
    document.getElementById("corrTitle").textContent = "Correspondances : " + place.label;
    let html = "", lastLayer = null;
    items.forEach(it => {
      const layer = CANAL[it.c.code] ? LAYER_OF(it.c.code) : "vaisseaux";
      if(lastLayer !== null && layer !== lastLayer) html += '<div class="cgap"></div>';
      lastLayer = layer;
      if(FAMILIES[pid]){
        const ms = FAMILIES[pid].members;
        const hit = [];
        it.s.branches.forEach(b => { if(branchShown(it.s, b)) b.places.forEach(q => { if(ms.includes(q) && !hit.includes(q)) hit.push(q); }); });
        it.where = hit.map(q => (PLACES[q] || {label:q}).label).join(", ");
      }
      if(it.via && !it.where) it.where = it.via;
      html += rowHtml(it);
    });
    document.getElementById("corrBody").innerHTML =
      '<div class="rename"><label for="renameInput">Nom du lieu</label><input id="renameInput" data-pid="' + esc(pid) + '" value="' + esc(place.label) + '"></div>' +
      (html || "<p>Aucun trajet.</p>");
    corrPid = pid;
    document.getElementById("corr").classList.add("open");
    document.querySelectorAll(".node").forEach(n => n.classList.toggle("sel", n.dataset.pid === pid));
  }

  function openIndex(){
    const groups = {};
    Object.keys(PLACES).forEach(pid => {
      const g = PLACES[pid].group || "autres";
      (groups[g] = groups[g] || []).push(pid);
    });
    const order = ["familles", "tête", "membre supérieur", "tronc", "membre inférieur", "organes", "canaux", "points", "ajoutés"];
    document.getElementById("corrTitle").textContent = "Correspondances — lieux de passage";
    document.getElementById("corrBody").innerHTML = '<div class="places-index">' + order.filter(g => groups[g]).map(g =>
      "<h3>" + esc(g) + "</h3>" + groups[g].sort((a, b) => PLACES[a].label.localeCompare(PLACES[b].label, "fr", {numeric:true}))
        .map(pid => '<button type="button" data-pid="' + esc(pid) + '">' + esc(PLACES[pid].label) + " (" + sectionsThrough(pid).length + ")</button>").join("")
    ).join("") + "</div>";
    document.getElementById("corr").classList.add("open");
  }

  // Plan vectoriel vertical : chaque branche est une seule ligne verticale,
  // lieux dans l'ordre du texte ; une branche secondaire part, à droite, du
  // lieu où elle se sépare d'une branche déjà tracée.
  // Une branche qui part d'un point non cité dans les branches précédentes
  // (ex. « part de P 7 » alors que la branche principale cite P 5 puis P 10) :
  // ce point est placé sur la branche précédente, entre ses voisins de
  // numérotation, pour que la branche s'y accroche.
  function withJunctions(branches){
    const out = branches.map(b => ({...b, places:b.places.slice(), img:(b.img || b.places.map(() => null)).slice(), inferred:new Set()}));
    const ptNum = pid => { const m = /^pt:(\S+) (\d+)$/.exec(pid); return m ? {code:m[1], n:Number(m[2])} : null; };
    for(let bi = 1; bi < out.length; bi++){
      const first = out[bi].places[0];
      const fp = ptNum(first);
      if(!fp || out.slice(0, bi).some(b => b.places.includes(first))) continue;
      for(let pi = bi - 1; pi >= 0; pi--){
        const pl = out[pi].places;
        let insertAt = -1;
        for(let i = 0; i < pl.length - 1 && insertAt < 0; i++){
          const a = ptNum(pl[i]);
          if(!a || a.code !== fp.code || a.n >= fp.n) continue;
          for(let j = i + 1; j < pl.length; j++){
            const b = ptNum(pl[j]);
            if(b && b.code === fp.code){ if(b.n > fp.n) insertAt = j; break; }
          }
        }
        if(insertAt > 0){
          pl.splice(insertAt, 0, first);
          out[pi].img.splice(insertAt, 0, null);
          out[pi].inferred.add(first);
          break;
        }
      }
    }
    return out;
  }

  // Nom du canal / vaisseau pour une section (ex. « Zù yáng míng zhèng jīng », « Chōng mài »)
  function sectionName(c, s){
    const meta = CANAL[c.code];
    if(!meta) return c.name.replace(/ — .*/, "") + (s.type === "luo" ? " luò mài" : "");
    return meta.limb + " " + meta.layer.toLowerCase() + " " + (TYPE[s.type] || [""])[0];
  }

  // Plan façon plan de métro, pour rester étroit :
  // - le tronc reste sur une seule voie verticale : une branche qui reprend là où une
  //   voie s'arrête (« le trajet principal continue… ») la prolonge, sans nouvelle colonne ;
  // - une branche qui se sépare en cours de route prend la voie libre la plus proche à
  //   droite ; une voie libérée plus haut (branche terminée) est réutilisée plus bas ;
  // - le numéro de la branche (= paragraphe) est posé à gauche de sa première station.
  // sigles des canaux : régulier = code de l'organe ; RM, DM ; ChM ; QM / WM avec ▲ yáng, ▼ yīn
  const SIGLE = {CM:"ChM", YangQ:"QM▲", YinQ:"QM▼", YangW:"WM▲", YinW:"WM▼", DaiM:"DaiM"};
  const sigle = code => SIGLE[code] || code;
  const SIGLE_COLOR = {terre:"#c79600", bois:"#2f9a3c", feu:"#e0261b", eau:"#1f5fd6", metal:"#444"};
  function otherCanals(pid, hereCode){
    if(pid.startsWith("c:")) return [];
    // membres : les canaux longent le bras, la jambe, la main, le pied… sans s'y croiser ;
    // seuls les points y marquent un vrai carrefour (prudence aux extrémités)
    const g = (PLACES[pid] || {}).group;
    if(!pid.startsWith("pt:") && (g === "membre supérieur" || g === "membre inférieur")) return [];
    const codes = [];
    const certain = new Set();
    sectionsThrough(corrKey(pid)).forEach(it => {
      if(it.c.code === hereCode) return;
      if(!codes.includes(it.c.code)) codes.push(it.c.code);
      if(it.certain) certain.add(it.c.code);
    });
    codes.certain = certain;
    return codes;
  }

  const zoneBands = html => (html.match(/<g class="node zonepass"[\s\S]*?<\/g>/g) || []).join("");
  const stationsOnly = html => html.replace(/<g class="node zonepass"[\s\S]*?<\/g>/g, "");
  function planSvg(s, title){
    if(!s.branches || !s.branches.length) return "";
    // « Canal X » juste à côté d'un carrefour qui affiche déjà X : doublon retiré
    const dedup = b => {
      const near = (i, step) => { let j = i + step; while(j >= 0 && j < b.places.length && b.places[j].startsWith("c:")) j += step; return b.places[j]; };
      const keep = b.places.map((p, i) => !(p.startsWith("c:") && [near(i, -1), near(i, 1)].some(q => q && q.startsWith("pt:") && otherCanals(q, current).includes(p.slice(2)))));
      const pl = b.places.filter((p, i) => keep[i]), im = (b.img || b.places.map(() => null)).filter((p, i) => keep[i]);
      const k2 = pl.map((p, i) => i === 0 || p !== pl[i - 1]);
      return {...b, places:pl.filter((p, i) => k2[i]), img:im.filter((p, i) => k2[i])};
    };
    const branches = withJunctions(s.branches.map((b, i) => ({...dedup(b), origBi:i})).filter(b => branchShown(s, b)));
    if(!branches.length) return "";
    const STEP = 30, LANE_W = 132, X0 = 24, MAXCH = 17;
    const lanes = [];     // intervalles verticaux occupés, par voie
    const drawn = [];     // stations placées {pid, lane, y, inferred}
    const segs = [];      // tronçons {bi, lane, nodes, from, dashed, k}
    const isFree = (l, y0, y1) => !(lanes[l] || []).some(([a, b]) => y0 < b + STEP && a < y1 + STEP);
    const occupy = (l, y0, y1) => (lanes[l] = lanes[l] || []).push([y0, y1]);
    branches.forEach((b, bi) => {
      const places = b.places.slice();
      let startY = 0, from = null, dashed = false, k = 0, fallback = false;
      // ce que dit le paragraphe : branche latérale (« une branche se détache… ») ou élément
      // d'une énumération (« se divise en deux : la première…, la seconde… »)
      const txt = (s.paragraphs[b.p] || "").replace(/^-\s*/, "").replace(/^(D[’']ici|De là)\s*,?\s*/i, "");
      const sideText = /\b(une|d[’']une)\s+(autre\s+|petite\s+)?branche|déviation|se\s+détache/i.test(txt) && !/trajet principal|branche principale/i.test(txt);
      const siblingText = /^(la|une)\s+(seconde|deuxième|troisième|quatrième|autre)\b/i.test(txt);
      if(bi > 0){
        let junction = null;
        // premier lieu de la branche déjà placé = lieu de séparation
        for(let i = 0; i < places.length && !junction; i++){
          const hit = drawn.slice().reverse().find(n => n.pid === places[i]);
          if(hit) junction = {node:hit, k:i};
        }
        // aucun lieu commun :
        if(!junction && segs.length){
          const prev = segs[segs.length - 1];
          if(siblingText && prev.from){
            // « la seconde… » : même lieu de division que « la première… »
            junction = {node:prev.from, k:-1};
          }else if((s.type === "luo" || s.type === "grand_luo") && /^une\s+(autre\s+)?branche/i.test(txt)){
            // vaisseau liaison : « une (autre) branche… » part du point luò (début du trajet)
            junction = {node:segs[0].nodes[0], k:-1};
          }else{
            // sinon elle part de la fin de la branche précédente (« à partir de là… »)
            junction = {node:prev.nodes[prev.nodes.length - 1], k:-1};
          }
          fallback = true;
        }
        if(junction){
          from = junction.node;
          if(junction.k === 0){ places.shift(); startY = from.y + STEP; }
          else if(junction.k < 0){ startY = from.y + STEP; }
          else{ dashed = true; k = junction.k; startY = from.y - k * STEP; }
        }
      }
      if(!places.length) return;
      const endY = startY + (places.length - 1) * STEP;
      let lane = 0;
      if(from && !dashed && !sideText && isFree(from.lane, startY, endY)){
        lane = from.lane;                       // la voie s'arrêtait là : on la prolonge
      }else if(from){
        // voie libre la plus proche de la voie d'origine : à droite, puis à gauche, puis plus loin
        const top = dashed ? startY : from.y;
        for(let d = 1; ; d++){
          if(isFree(from.lane + d, top, endY)){ lane = from.lane + d; break; }
          if(from.lane - d >= 0 && isFree(from.lane - d, top, endY)){ lane = from.lane - d; break; }
        }
      }else{
        while(!isFree(lane, startY, endY)) lane++;
      }
      occupy(lane, from && !dashed ? from.y : startY, endY);
      const base = b.places.length - places.length;   // 1 si le lieu de séparation (déjà dessiné) a été retiré
      const nodes = places.map((pid, i) => ({pid, lane, y:startY + i * STEP, inferred:b.inferred.has(pid), bi:b.origBi, idx:base + i, cp:b.img[base + i]}));
      nodes.forEach(n => drawn.push(n));
      segs.push({bi:b.origBi, lane, nodes, from, dashed, k, fallback, interne:!!b.interne, interneSrc:b.interneSrc});
    });
    const allY = segs.flatMap(g => g.nodes.map(n => n.y)).concat(segs.filter(g => g.from).map(g => g.from.y));
    const minY = Math.min(...allY), maxY = Math.max(...allY), off = 16 - minY;
    const nLanes = Math.max(...segs.map(g => g.lane)) + 1;
    const lx = l => X0 + l * LANE_W;
    const W = lx(nLanes - 1) + 122, H = maxY - minY + 34;
    const line = (d, extra) => '<path d="' + d + '" fill="none"' + (extra && extra.includes("stroke=") ? "" : ' stroke="var(--line)"') + ' stroke-width="2.4" stroke-linejoin="round"' + (extra || "") + "/>";
    let lines = "", stations = "", nums = "";
    segs.forEach(g => {
      const x = lx(g.lane), first = g.nodes[0], last = g.nodes[g.nodes.length - 1];
      const st = g.interne ? ' stroke-dasharray="6 4" stroke="#9aa0c8" opacity=".85"' : "";
      if(g.from && !g.dashed){
        lines += line("M" + lx(g.from.lane) + "," + (g.from.y + off) + (g.from.lane !== g.lane ? " H" + x : "") + " V" + (last.y + off), st);
      }else{
        if(g.dashed){
          // même lieu plus loin dans la branche : liaison entre les deux
          lines += line("M" + lx(g.from.lane) + "," + (g.from.y + off) + " H" + x, st);
        }
        if(g.nodes.length > 1) lines += line("M" + x + "," + (first.y + off) + " V" + (last.y + off), st);
      }
      nums += '<text class="br-label' + (g.interne ? " int" : "") + '" data-bi="' + g.bi + '" x="' + (x - 13) + '" y="' + (first.y + off + 3.5) + '" text-anchor="end">' +
        (g.bi + 1) + "<title>Branche " + (g.bi + 1) + (g.interne ? " : interne" : " : externe") + (g.interneSrc ? " (" + g.interneSrc + ")" : "") +
        (editing && g.interneSrc ? " — clic : changer" : "") + "</title></text>";
      g.nodes.forEach(p => {
        const y = p.y + off;
        const info = PLACES[p.pid] || {label:p.pid, group:""};
        const isPoint = p.pid.startsWith("pt:");
        // zone du corps : un quartier que la ligne traverse, pas un arrêt
        if(!isPoint && !p.pid.startsWith("c:") && !p.cp){
          const q = typeof zoneQuartier === "function" ? zoneQuartier(p.pid) : null;
          const inQ = q ? Object.entries(Object.assign({}, DEFAULT_POINT_ZONE, edits.pointZone || {})).filter(([pt, z]) => z === q).map(([pt]) => pt.slice(3)) : [];
          const organ = info.group === "organes";
          const lab = info.label.length > MAXCH + 2 ? info.label.slice(0, MAXCH + 1) + "…" : info.label;
          stations += '<g class="node zonepass" data-pid="' + esc(p.pid) + '" data-bi="' + p.bi + '" data-idx="' + p.idx + '"><title>Quartier traversé : ' + esc(info.label) +
            (inQ.length ? " — arrêt(s) du quartier : " + esc(inQ.join(", ")) : "") + "</title>" +
            '<rect x="' + (x - 8) + '" y="' + (y - 11) + '" width="' + (MAXCH * 6.4 + 22) + '" height="22" rx="11" fill="' + (organ ? "#f6dcd2" : "#efe9d8") + '" opacity=".9"/>' +
            '<text class="zlabel" x="' + (x + 9) + '" y="' + (y + 4) + '">' + esc(lab) + (inQ.length ? " · " + esc(inQ.join(", ")) : "") + "</text></g>";
          return;
        }
        const color = isPoint ? "var(--point)" : info.group === "organes" ? "var(--organ)" : info.group === "canaux" ? "var(--canal)" : "var(--zone)";
        const r = isPoint ? 5 : 7;
        const tip = info.label + " — cité dans le texte au départ d’une autre branche ; sa place sur cette ligne est déduite de la numérotation";
        const cp = p.cp, pending = cp && complementStatus(cp) !== "validé";
        const others = otherCanals(p.pid, current);
        stations += '<g class="node' + (cp ? " from-image" : "") + (pending ? " pending" : "") + '" data-pid="' + esc(p.pid) + '" data-bi="' + p.bi + '" data-idx="' + p.idx + '"' +
          (cp ? ' data-cp="' + esc(cp.id) + '"' : "") + (p.inferred ? '><title>' + esc(tip) + "</title>" : ">") +
          (pending ? '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 5) + '" fill="#ffe27a" opacity=".75"/>' : "") +
          (others.length ? '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 3.5) + '" fill="#fff" stroke="#1d1d1f" stroke-width="2.6"/>' : "") +
          '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (isPoint && !cp ? color : "#fff") + '" stroke="' + (cp ? "#8a8aa0" : color) + '" stroke-width="2.2"' + (cp ? ' stroke-dasharray="2.5 2"' : "") + "/>" +
          '<text x="' + (x + (others.length ? 15 : 11)) + '" y="' + (y + (others.length ? 1 : 3.5)) + '"' + (cp ? ' font-style="italic" fill="#6d6d85"' : "") + (others.length ? ' font-weight="700"' : "") + ">" + esc(info.label.length > MAXCH ? info.label.slice(0, MAXCH - 1) + "…" : info.label) + "</text>" +
          (others.length ? '<text class="xfer" x="' + (x + 15) + '" y="' + (y + 11) + '">' +
            others.slice(0, 6).map(code => '<tspan fill="' + (SIGLE_COLOR[ELEMENT[code]] || "#7a3fb0") + '">' + esc(sigle(code)) + (others.certain && others.certain.has(code) ? "*" : "") + "</tspan>").join(" ") +
            (others.length > 6 ? " +" + (others.length - 6) : "") + "</text>" : "") + "</g>";
      });
    });
    return '<div class="plan"><h4>Plan des vaisseaux du ' + esc(title) + '</h4><div class="plan-scroll"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img">' +
      zoneBands(stations) + lines + stationsOnly(stations) + nums + "</svg></div>" +
      '<div class="legend"><span><i style="background:var(--point)"></i>point</span><span><i style="background:#efe9d8;border-radius:4px;width:16px"></i>quartier traversé (zone du corps)</span><span><i style="background:#f6dcd2;border-radius:4px;width:16px"></i>organe</span><span><i style="border:2px solid var(--canal)"></i>canal rejoint</span><span><i style="border:2px dashed #8a8aa0"></i>d’après l’illustration</span><span><i style="border:3px solid #1d1d1f"></i>autres canaux ici</span><span>n : début de la branche n</span><span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#9aa0c8" stroke-width="2.4" stroke-dasharray="6 4"/></svg>branche interne</span></div></div>';
  }

  // =====================================================================
  // Réseau global, façon plan de ville : chaque canal régulier est une ligne de
  // métro (tous ses points), RM et DM un fleuve, les merveilleux vaisseaux des
  // rivières ; les zones du corps sont des quartiers (centre-ville = organes,
  // banlieue = extrémités), les articulations de grands carrefours.
  // =====================================================================

    // tête
    tete:[600,60], vertex:[600,40], crane:[600,52], parietal:[565,50], cerveau:[610,72], front:[600,96], "angle-frontal":[545,96],

    nez:[600,162], "racine-nez":[600,142], "aile-nez":[586,170], "arriere-nez":[608,174], nasopharynx:[608,184],

    "cavite-corp":[600,512], abdomen:[600,522], ombilic:[600,542], "abdomen-inf":[600,602], pubis:[600,652], symphyse:[600,656],

  // Zoom : molette (autour du curseur), glisser pour se déplacer, pincement à deux doigts, boutons.
  function initNetZoom(svg){
    const wrap = svg.parentElement;
    const box = svg.getBBox();
    const pad = 40;
    let vb = null;
    const apply = () => { svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); NET_VB = Object.assign({}, vb); };
    const fit = () => {
      const r = wrap.getBoundingClientRect();
      const ratio = r.width > 50 && r.height > 50 ? r.height / r.width : 0.75;   // cadre pas encore affiché
      let w = box.width + pad * 2, h = w * ratio;
      if(h < box.height + pad * 2){ h = box.height + pad * 2; w = h / ratio; }
      vb = {x:box.x + box.width / 2 - w / 2, y:box.y + box.height / 2 - h / 2, w, h};
      apply();
    };
    const zoomAt = (factor, cx, cy) => {
      const r = svg.getBoundingClientRect();
      if(r.width < 10 || r.height < 10) return;
      const px = vb.x + (cx - r.left) / r.width * vb.w, py = vb.y + (cy - r.top) / r.height * vb.h;
      const w = Math.min(Math.max(vb.w * factor, 120), (box.width + pad * 2) * 3);
      const k = w / vb.w;
      vb = {x:px - (px - vb.x) * k, y:py - (py - vb.y) * k, w, h:vb.h * k};
      apply();
    };
    // afficher / masquer des éléments ne doit pas dézoomer : on garde le cadrage précédent
    let touched = !!NET_VB;
    if(NET_VB){ vb = Object.assign({}, NET_VB); apply(); }
    else{
      fit();
      // téléphone : on démarre déjà zoomé sur le tronc (le plan entier y est illisible)
      if(window.innerWidth < 760){ vb = {x:vb.x + vb.w * 0.3, y:vb.y + vb.h * 0.22, w:vb.w * 0.4, h:vb.h * 0.4}; apply(); }
    }
    try{ new ResizeObserver(() => { if(!touched) fit(); }).observe(wrap); }catch(e){}
    svg.addEventListener("wheel", () => { touched = true; }, {passive:true});
    svg.addEventListener("pointerdown", () => { touched = true; });
    svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0016), e.clientX, e.clientY); }, {passive:false});
    const ptrs = new Map();
    let dragged = false, last = null, pinch = null;
    svg.addEventListener("pointerdown", e => {
      if(editing && e.target.closest && e.target.closest(".netstop")) return;   // glisser d'une station : voir showNetwork
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      dragged = false; last = [e.clientX, e.clientY];
      if(ptrs.size === 2){ const [p1, p2] = [...ptrs.values()]; pinch = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]); }
    });
    svg.addEventListener("pointermove", e => {
      if(!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      if(ptrs.size === 2 && pinch){
        const [p1, p2] = [...ptrs.values()], dist = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
        zoomAt(pinch / dist, (p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2);
        pinch = dist; dragged = true;
        return;
      }
      const dx = e.clientX - last[0], dy = e.clientY - last[1];
      if(!dragged && Math.hypot(dx, dy) < 4) return;
      if(!dragged){ dragged = true; try{ svg.setPointerCapture(e.pointerId); }catch(err){} svg.classList.add("dragging"); }
      const r = svg.getBoundingClientRect();
      if(r.width < 10 || r.height < 10) return;
      vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h;
      last = [e.clientX, e.clientY];
      apply();
    });
    const up = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; svg.classList.remove("dragging"); };
    svg.addEventListener("pointerup", up);
    svg.addEventListener("pointercancel", up);
    svg.addEventListener("click", e => { if(dragged){ e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
    wrap.querySelector(".netzoom").addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      const r = svg.getBoundingClientRect();
      if(b.dataset.z === "fit"){ NET_VB = null; fit(); }
      else zoomAt(b.dataset.z === "in" ? 1 / 1.4 : 1.4, r.left + r.width / 2, r.top + r.height / 2);
    });
  }

    // 3. stations : chaque canal suit une courbe continue qui passe, dans l'ordre, par la zone (et la face)

    YinQ:"yīn qiāo mài", YangQ:"yáng qiāo mài", YinW:"yīn wéi mài", YangW:"yáng wéi mài"};
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    if(ZONE_RX[pid]) return new RegExp(B + "(?:" + ZONE_RX[pid] + ")" + A, "giu");

    for(let n = walker.nextNode(); n; n = walker.nextNode()){
      for(let i = 0; i < n.data.length; i++) map.push([n, i]);
      text += n.data;
    }
    return {text, map};
  }

    const r = range.getBoundingClientRect();

  function highlightMention(nodeEl){

    const s = canal && canal.sections[si];
    const b = s && s.branches[Number(nodeEl.dataset.bi)];
    const pid = nodeEl.dataset.pid, rx = placeRegex(pid);
    if(!b || !rx) return;
    // n-ième passage par ce lieu dans la branche → n-ième mention dans ses paragraphes
    const occ = b.places.slice(0, Number(nodeEl.dataset.idx)).filter(x => x === pid).length;
    let seen = 0, last = null;
    for(const pi of (b.ps || [b.p])){
      const el = sec.querySelector('[data-para="' + current + "|" + si + "|" + pi + '"]');
      if(!el) continue;
      const {text, map} = flatText(el);
      rx.lastIndex = 0;
      for(let m = rx.exec(text); m; m = rx.exec(text)){
        if(!m[0].length){ rx.lastIndex++; continue; }
        const range = document.createRange();
        const a = map[m.index], z = map[m.index + m[0].length - 1];
        range.setStart(a[0], a[1]); range.setEnd(z[0], z[1] + 1);
        last = range;
        if(seen++ === occ){ showMention(range); return; }
      }

      const pid = el.dataset.pid, label = el.value.trim();
      if(!label) return;
      if(ORIG.PLACES[pid] && ORIG.PLACES[pid].label === label && !String(pid).startsWith("u:")) delete edits.places[pid];
      else edits.places[pid] = {...(edits.places[pid] || {}), label};
      saveEdits(); applyEdits(); show(current, undefined, true); openCorr(pid);
    }
  });
  // « retirer » dans une liste de correspondances : enlève ce lieu du trajet
  document.addEventListener("click", event => {
    const b = event.target.closest(".rm");
    if(!b) return;
    event.stopPropagation();
    const [code, si] = b.dataset.rm.split("|");
    const s = data.find(c => c.code === code).sections[si];
    edits.branches[b.dataset.rm] = s.branches.map(br => br.places.filter(pid => pid !== corrPid)).filter(l => l.length);
    saveEdits(); applyEdits(); show(current, undefined, true); openCorr(corrPid);
  }, true);
  // survol d'un lieu du plan : les autres canaux qui passent par ce lieu
  const tip = document.getElementById("tip");
  document.addEventListener("mouseover", event => {
    const node = event.target.closest(".node");
    if(!node){ tip.style.display = "none"; return; }
    const pid = node.dataset.pid;
    // tous les trajets qui passent ici, sauf celui qu'on regarde (les autres trajets du même
    // canal — tendineux, distinct… — restent listés)
    const sec = node.closest("section");
    const hereSi = sec ? Number(sec.id.replace("sec-", "")) : -1;
    const others = sectionsThrough(corrKey(pid)).filter(it => !(it.c.code === current && it.si === hereSi));
    const cp = node.dataset.cp && COMPLEMENTS.find(x => x.id === node.dataset.cp);
    tip.innerHTML = (cp ? '<span style="display:block;margin-bottom:5px;color:#6d6d85"><i>' + (cp.source ? "Selon la " + esc(cp.source) : "D\u2019après l\u2019illustration" + (cp.page ? " (p. " + cp.page + ")" : "")) +
        ", non cité dans le texte</i> — <b>" + esc(complementStatus(cp)) + "</b>" + (cp.note ? "<br>" + esc(cp.note) : "") +
        (editing && complementStatus(cp) !== "validé" ? "<br>Clic : valider ou refuser" : "") + "</span>" : "") +
      "<b>" + esc((PLACES[pid] || {label:pid}).label) + " — autres trajets" + (FAMILY_OF[pid] ? " (famille « " + esc(FAMILIES[FAMILY_OF[pid]].label) + " »)" : "") + "</b>" +
      (others.length ? others.map(rowHtml).join("") : '<span class="none">Aucun autre trajet ne passe ici.</span>') +
      '<span class="none" style="display:block;margin-top:5px;font-size:.72rem">Clic : voir dans le texte · double-clic : liste des correspondances</span>';
    tip.querySelectorAll(".rm").forEach(b => b.remove());
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", event => {
    if(tip.style.display !== "block") return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = event.clientX + 14, y = event.clientY + 14;
    if(x + w > innerWidth - 8) x = event.clientX - w - 14;
    if(y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.getElementById("editToggle").addEventListener("click", () => {
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    const t = document.getElementById("editToggle");
    t.classList.toggle("on", editing); t.setAttribute("aria-pressed", editing);
    t.textContent = editing ? "✓ Terminer" : "✎ Modifier";
    show(current, undefined, true);
    if(corrPid && document.getElementById("corr").classList.contains("open")) openCorr(corrPid);
  });
  document.getElementById("exportEdits").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(edits, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "trajets-corrections-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById("importEdits").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if(!file) return;
    try{
      edits = Object.assign(emptyEdits(), JSON.parse(await file.text()));
      saveEdits(); applyEdits(); location.reload();
    }catch(e){ alert("Fichier de corrections illisible."); }
  });
  document.getElementById("resetEdits").addEventListener("click", () => {
    if(!confirm("Annuler toutes les corrections (textes, arrêts, noms de lieux) ? Les cases « vérifié » sont gardées.")) return;
    edits = {...emptyEdits(), verified:edits.verified};
    saveEdits(); applyEdits(); show(current, undefined, true);
  });
  updateEditCount();
  document.getElementById("typeToggle").addEventListener("click", e => {
    const h = e.target.closest("header"), on = h.classList.toggle("showtypes");
    e.target.setAttribute("aria-expanded", on); e.target.textContent = on ? "Types ▴" : "Types ▾";
  });
  document.querySelectorAll("#typeFilter input").forEach(box => {
    box.checked = TYPES_ON[box.dataset.type] !== false;
    box.addEventListener("change", () => {
      TYPES_ON[box.dataset.type] = box.checked;
      try{ localStorage.setItem(TYPES_KEY, JSON.stringify(TYPES_ON)); }catch(e){}
      if(view === "network") showNetwork(); else show(current, undefined, true);
      const corr = document.getElementById("corr");
      if(corr.classList.contains("open")){ if(corrPid) openCorr(corrPid); else openIndex(); }
    });
  });
  document.addEventListener("dblclick", event => {
    const node = event.target.closest(".node");
    if(node) openCorr(corrKey(node.dataset.pid));
  });
  document.getElementById("corrClose").addEventListener("click", () => document.getElementById("corr").classList.remove("open"));
  document.getElementById("allPlaces").addEventListener("click", openIndex);
  document.addEventListener("keydown", e => { if(e.key === "Escape") document.getElementById("corr").classList.remove("open"); });

  document.getElementById("netToggle").addEventListener("click", () => { if(view === "network") show(lastCanal || (data[0] && data[0].code)); else showNetwork(); });
  if(location.hash === "#reseau") showNetwork();
  else show(location.hash.slice(1) || (data[0] && data[0].code));
  // lien direct vers une liste de correspondances : index.html?lieu=yeux
  const lieu = new URLSearchParams(location.search).get("lieu");
  if(lieu && (PLACES[lieu] || PLACES["fam:" + lieu])) openCorr(PLACES["fam:" + lieu] ? "fam:" + lieu : lieu);
  })();
</script>
</body>
</html>
