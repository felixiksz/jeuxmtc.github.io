<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<meta name="robots" content="noindex, nofollow">
<title>Correspondance</title>
<link href="../fonts/fonts.css?v=20261006-a" rel="stylesheet">
<style>
  /* « Correspondance » : le jeu du module Trajets (il remplace l'Itinéraire).
     Une ligne (un canal), ses points d'intersection en stations, un véhicule arrêté par des travaux :
     il doit changer de ligne à la bonne station. Les intersections sont celles du plan (trajets-jiaohui.js).
     Une partie = une série de dix trajets, avec un record. ?ligne=Rt : la série part toujours de cette ligne. */
  :root{ --page-bg:#FCFCFA; --text-color:#271629; --shadow-color:#0000FF; --mtc-accent:#0000FF;
    --tint:color-mix(in srgb, var(--text-color) 58%, var(--page-bg)); --faint:color-mix(in srgb, var(--text-color) 16%, var(--page-bg)); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text-color); font:400 15px/1.45 'Archivo', sans-serif; -webkit-font-smoothing:antialiased; }
  main{ max-width:560px; margin:0 auto; padding:18px 20px 84px; }
  .sc{ font:800 .68rem/1.3 'Archivo', sans-serif; letter-spacing:.09em; text-transform:uppercase; }
  .t{ color:var(--tint); } a{ color:inherit; text-decoration:none; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; }
  h1{ font:400 1.7rem/1.15 'Libre Baskerville', Georgia, serif; margin:0 0 10px; }
  /* la série : un trait par trajet */
  .prog{ display:flex; gap:3px; margin:0 0 16px; } .prog i{ flex:1; height:3px; background:var(--faint); transition:background .4s; }
  .prog i.ok{ background:var(--mtc-accent); } .prog i.mid{ background:var(--tint); } .prog i.cur{ background:var(--text-color); }
  #q{ margin:0 0 6px; min-height:4.4em; }
  #board{ display:block; width:100%; height:auto; overflow:visible; touch-action:manipulation; }
  #res{ min-height:3em; margin:8px 0 0; }
  .ok{ color:#1a8a3a; font-weight:800; } .no{ color:#c0392b; font-weight:800; }
  .act{ display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; border-top:1px solid var(--text-color); padding-top:12px; }
  .go{ color:var(--mtc-accent); cursor:pointer; background:none; border:0; padding:0; transition:letter-spacing .25s, opacity .3s; } .go:hover{ letter-spacing:.14em; }
  .go[hidden]{ display:inline; visibility:hidden; }
  /* fin de série */
  #end{ display:none; } .fin #end{ display:block; } .fin #board, .fin #q, .fin #res{ display:none; }
  #end h2{ font:400 1.35rem/1.2 'Libre Baskerville', Georgia, serif; margin:8px 0 6px; }
  #end p{ margin:0 0 18px; } #end ul{ list-style:none; margin:8px 0 0; padding:0; } #end li{ padding:8px 0; border-top:1px solid var(--faint); }
  #end .tg{ display:inline-block; min-width:19px; height:19px; padding:0 4px; margin-left:4px; border-radius:999px; color:var(--page-bg); font:800 9.5px/19px 'Archivo', sans-serif; text-align:center; vertical-align:1px; }
  .lineA, .lineB, .link{ fill:none; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
  .st{ cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; } .st:focus-visible circle{ stroke-width:3.6; } .st circle{ fill:var(--page-bg); stroke:var(--text-color); stroke-width:2.4; transition:r .2s; }
  .st:hover circle{ r:10.5; } .st.done{ cursor:default; }
  .st text, .lbl{ font:800 11px 'Archivo', sans-serif; fill:var(--text-color); text-anchor:middle; }
  .st.bad circle{ stroke:#c0392b; } .st.good circle{ stroke:#1a8a3a; stroke-width:3.4; }
  .st.shake{ animation:shake .4s; } @keyframes shake{ 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  .stub{ fill:none; stroke-width:4; stroke-linecap:round; } .tag circle{ stroke:none; } .tag text{ font:800 9.5px 'Archivo', sans-serif; fill:var(--page-bg); text-anchor:middle; dominant-baseline:central; }
  .pop{ animation:pop .35s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center; } @keyframes pop{ from{ transform:scale(0); } }
  .draw{ stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:draw .7s ease-out forwards; } @keyframes draw{ to{ stroke-dashoffset:0; } }
  #veh{ transition:transform .7s cubic-bezier(.45,.05,.3,1); }
  #veh .body{ fill:var(--text-color); } #veh .win{ fill:var(--page-bg); } #veh .wire{ fill:none; stroke:var(--text-color); stroke-width:1.6; stroke-linecap:round; }
  .bump{ animation:bump .5s; } @keyframes bump{ 30%{ translate:7px 0; } 60%{ translate:-3px 0; } }
  .barrier rect{ fill:var(--page-bg); stroke:var(--text-color); stroke-width:1.8; } .barrier path{ stroke:var(--text-color); stroke-width:1.8; fill:none; stroke-linecap:round; }
  .barrier .stripe{ stroke:#c0392b; stroke-width:3; }
  .term circle{ stroke:none; } .term text{ font:800 11px 'Archivo', sans-serif; fill:var(--page-bg); text-anchor:middle; dominant-baseline:central; }
  .goal{ fill:none; stroke:var(--mtc-accent); stroke-width:1.8; stroke-dasharray:3 4; animation:spin 9s linear infinite; transform-box:fill-box; transform-origin:center; } @keyframes spin{ to{ transform:rotate(360deg); } }
  /* le lexique sous la main, sur toutes les pages : recherche, panier, comparer */
  footer{ position:fixed; left:0; right:0; bottom:0; background:var(--page-bg); }
  footer div{ max-width:560px; margin:0 auto; padding:10px 20px 14px; display:flex; justify-content:center; }
  .tools{ display:flex; gap:26px; } .tools a{ display:block; } .tools svg{ display:block; width:21px; height:21px; }
  .tools .l{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; } .tools a:hover{ color:var(--mtc-accent); }
  @media (prefers-reduced-motion:reduce){ .goal, .bump, .pop, .st.shake{ animation:none; } #veh{ transition:none; } }
</style>
</head>
<body>
<main>
  <div class="top"><a class="sc" id="back" href="../index.html">← Accueil</a><span class="sc t" id="score"></span></div>
  <h1>Correspondance</h1>
  <div class="prog" id="prog"></div>
  <p id="q"></p>
  <svg id="board" viewBox="0 0 360 250" role="img" aria-label="Une ligne, ses stations, et la ligne à rejoindre"></svg>
  <p id="res"></p>
  <div id="end"></div>
  <div class="act"><span class="sc t" id="rec"></span><button type="button" class="sc go" id="next" hidden>Trajet suivant →</button></div>
</main>
<footer><div><span class="tools">
  <a href="../index.html#ouvrir-recherche" target="_top" title="Recherche" aria-label="Recherche"><svg viewBox="0 0 24 24"><circle class="l" cx="10.5" cy="10.5" r="6.5"/><path class="l" d="M15.5 15.5L21 21"/></svg></a>
  <a href="../index.html#ouvrir-panier" target="_top" title="Panier" aria-label="Panier"><svg viewBox="0 0 24 24"><path class="l" d="M4 9H20L18.3 19.5H5.7Z"/><path class="l" d="M8.5 9L11 3.5M15.5 9L13 3.5"/></svg></a>
  <a href="../index.html#ouvrir-comparer" target="_top" title="Comparer A | B" aria-label="Comparer"><svg viewBox="0 0 24 24"><rect class="l" x="3.5" y="4.5" width="7" height="15" rx="1.5"/><rect class="l" x="13.5" y="4.5" width="7" height="15" rx="1.5"/></svg></a>
</span></div></footer>
<script src="../modules-theme.js?v=20261005-a"></script>
<script src="trajets-jiaohui.js?v=20261113-a"></script>
<script src="../celebrate.js?v=20261112-f"></script>
<script src="../70-progress-sync.js?v=20261112-b"></script>
<script src="../daily-streak-shared.js?v=20261006-a"></script>
<script src="../beta-config.js?v=20261108-a"></script>
<script src="../beta-gate.js?v=20261110-a"></script>
<script>
(function(){
  "use strict";
  // accès : comme le module Trajets (beta-gate.js)
  if(!window.mtcBetaGate || !window.mtcBetaGate({module:"trajets", title:"Correspondance"})){
    if(!window.mtcBetaGate) document.body.innerHTML = '<p style="padding:24px;font-family:system-ui,sans-serif">Page réservée.</p>';
    throw new Error("trajets : accès réservé");
  }
  const J = window.MTC_TRAJETS_JIAOHUI || {};
  const MAIN = ["P", "GI", "E", "Rt", "C", "IG", "V", "Rn", "EC", "TF", "VB", "F", "RM", "DM"];
  // couleurs des cinq mouvements, comme dans Réseaux ; le yáng un peu plus clair que le yīn pour distinguer deux lignes du même mouvement
  const BASE = {E:"#d9a400", Rt:"#d9a400", VB:"#2f9a3c", F:"#2f9a3c", C:"#e0261b", IG:"#e0261b", EC:"#e0261b", TF:"#e0261b", V:"#1f5fd6", Rn:"#1f5fd6"};
  const YANG = new Set(["GI", "E", "IG", "V", "TF", "VB", "DM"]);
  const col = c => { const b = BASE[c] || "var(--text-color)"; return YANG.has(c) ? "color-mix(in srgb, " + b + " 72%, var(--page-bg))" : b; };
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[ch]));

  // stations d'une ligne : ses propres points d'intersection, dans l'ordre des numéros, avec les autres canaux qui y passent
  const LINES = {};
  Object.entries(J).forEach(([code, v]) => {
    const own = code.split(" ")[0]; if(!MAIN.includes(own)) return;
    const others = [...new Set((v.canaux || []).concat(v.certains || []))].filter(c => c !== own && MAIN.includes(c));
    if(others.length) (LINES[own] = LINES[own] || []).push({code, n:+code.split(" ")[1], others});
  });
  Object.values(LINES).forEach(l => l.sort((a, b) => a.n - b.n));
  const PLAYABLE = Object.keys(LINES).filter(a => LINES[a].length >= 3);
  const VEH = [["métro", "Ce métro"], ["tram", "Ce tram"], ["bus", "Ce bus"]];

  const $ = id => document.getElementById(id);
  const main = document.querySelector("main"), board = $("board"), q = $("q"), res = $("res"), next = $("next");
  const N = 10, RKEY = "mtc_correspondance_record_v1";
  const want = new URLSearchParams(location.search).get("ligne");   // ligne imposée (lien direct)
  const best = () => { try{ return Number(localStorage.getItem(RKEY)) || 0; }catch(e){ return 0; } };
  // dans le bandeau d'entraînement, le retour à l'accueil est déjà dans le bandeau
  if(window.top !== window) $("back").style.visibility = "hidden";
  let R = null, S = null;
  const AY = 78, BY = 216, X0 = 26, X1 = 334;

  function newSeries(){ S = {marks:[], miss:[], used:new Set()}; main.classList.remove("fin"); newRound(); }
  function head(){
    const k = S.marks.length, fin = main.classList.contains("fin");
    $("score").textContent = fin ? "Série terminée" : "Trajet " + Math.min(N, k + (R && R.done ? 0 : 1)) + " sur " + N;
    $("prog").innerHTML = Array.from({length:N}, (v, i) => '<i class="' + (S.marks[i] || (i === k && !fin ? "cur" : "")) + '"></i>').join("");
    $("rec").textContent = best() ? "Record · " + best() + " sur " + N : want && PLAYABLE.includes(want) ? "Ligne " + want : "Série de " + N;
  }
  function newRound(){
    const prev = R;
    for(let t = 0; t < 300; t++){
      const a = want && PLAYABLE.includes(want) && t < 120 ? want : rnd(PLAYABLE), sts = LINES[a];
      const dests = [...new Set(sts.flatMap(s => s.others))].filter(b => { const k = sts.filter(s => s.others.includes(b)).length; return k >= 1 && k < sts.length; });
      if(!dests.length) continue;
      const b = rnd(dests);
      if(prev && prev.a === a && prev.b === b && t < 250) continue;   // pas deux fois de suite le même trajet
      if(S.used.has(a + ">" + b) && t < 200) continue;               // ni deux fois dans la série tant qu'il en reste d'autres
      const good = shuffle(sts.filter(s => s.others.includes(b))).slice(0, 2), bad = shuffle(sts.filter(s => !s.others.includes(b))).slice(0, 5 - good.length);
      if(!bad.length) continue;
      const list = good.concat(bad).sort((x, y) => x.n - y.n);
      // La bonne station tombait trop souvent à un bout de la ligne (beaucoup de canaux se croisent à leurs premiers ou à leurs
      // derniers points) : ces trajets-là ne sont gardés qu'une fois sur trois, pour que le bout de la ligne ne soit pas la réponse à deviner.
      if(t < 280 && ((list[list.length - 1].others.includes(b) && Math.random() > .32) || (list[0].others.includes(b) && Math.random() > .25))) continue;
      R = {a, b, list, veh:rnd(VEH), tried:new Set(), done:false, errs:0};
      S.used.add(a + ">" + b);
      break;
    }
    next.hidden = true;
    draw(); head();
  }
  const sx = i => 78 + i * (R.list.length > 1 ? (286 - 78) / (R.list.length - 1) : 0);

  function vehicle(kind){
    const win = [-11, -3, 5].map(x => '<rect class="win" x="' + x + '" y="-5" width="6" height="5" rx="1"/>').join("");
    if(kind === "bus") return '<rect class="body" x="-15" y="-9" width="30" height="15" rx="3.5"/>' + win + '<circle class="body" cx="-8" cy="8" r="3.2"/><circle class="body" cx="8" cy="8" r="3.2"/>';
    if(kind === "tram") return '<path class="wire" d="M-5 -9L0 -15L5 -9M-7 -15H7"/><rect class="body" x="-16" y="-9" width="32" height="17" rx="6"/>' + win;
    return '<rect class="body" x="-16" y="-9" width="32" height="17" rx="3"/>' + win + '<rect class="win" x="-13" y="3" width="26" height="1.6"/>';
  }
  function draw(){
    const a = R.a, b = R.b;
    q.innerHTML = "Travaux sur la ligne <b>" + esc(a) + "</b>. " + R.veh[1] + " doit rejoindre la ligne <b>" + esc(b) + "</b> : clique sur la station où il peut changer.";
    res.innerHTML = "";
    let s = "";
    // ligne à rejoindre, en bas, avec son terminus entouré
    s += '<path class="lineB" stroke="' + col(b) + '" d="M' + X0 + " " + BY + "H" + X1 + '"/>';
    s += '<g class="term"><circle cx="' + X1 + '" cy="' + BY + '" r="12" fill="' + col(b) + '"/><text x="' + X1 + '" y="' + BY + '">' + esc(b) + '</text></g><circle class="goal" cx="' + X1 + '" cy="' + BY + '" r="18"/>';
    // ligne du véhicule, en haut : terminus, stations, travaux au bout
    s += '<path class="lineA" stroke="' + col(a) + '" d="M' + X0 + " " + AY + "H" + (X1 - 22) + '"/>';
    s += '<g class="term"><circle cx="' + X0 + '" cy="' + AY + '" r="12" fill="' + col(a) + '"/><text x="' + X0 + '" y="' + AY + '">' + esc(a) + "</text></g>";
    s += '<g id="extra"></g>';
    s += '<g class="barrier" transform="translate(' + (X1 - 8) + " " + AY + ')"><path d="M-7 -4V12M7 -4V12"/><rect x="-11" y="-12" width="22" height="9" rx="1.5"/><path class="stripe" d="M-6 -4.5L-2 -10.5M1 -4.5L5 -10.5"/></g>';
    R.list.forEach((st, i) => { s += '<g class="st" data-i="' + i + '" tabindex="0" role="button" aria-label="Station ' + esc(st.code) + '"><rect x="' + (sx(i) - 24) + '" y="' + (AY - 52) + '" width="48" height="66" fill="transparent"/><circle cx="' + sx(i) + '" cy="' + AY + '" r="9"/><text x="' + sx(i) + '" y="' + (AY - 38) + '">' + esc(st.code) + "</text></g>"; });
    s += '<g id="veh" style="transform:translate(' + (X0 + 26) + "px," + (AY - 19) + 'px)">' + vehicle(R.veh[0]) + "</g>";
    board.innerHTML = s;
    board.querySelectorAll(".st").forEach(g => { g.addEventListener("click", () => pick(+g.dataset.i)); g.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(+g.dataset.i); } }); });
    // le véhicule avance jusqu'aux travaux et s'y cogne
    const veh = $("veh"), round = R;
    setTimeout(() => { if(R === round && !R.done) veh.style.transform = "translate(" + (X1 - 36) + "px," + (AY - 19) + "px)"; }, 250);
    setTimeout(() => { if(R === round && !R.done) veh.classList.add("bump"); }, 950);
  }
  // correspondances d'une station : petits embranchements de la couleur de chaque ligne
  function stubs(i, skip){
    const st = R.list[i], os = st.others.filter(c => c !== skip), x = sx(i);
    // à la station de correspondance, les autres lignes partent sur le côté pour laisser la place à la liaison
    return os.map((c, j) => { const dx = skip ? -(j + 1) * 21 : (j - (os.length - 1) / 2) * 20, x2 = x + dx, y2 = AY + 42;
      return '<path class="stub draw" style="--len:60" stroke="' + col(c) + '" d="M' + x + " " + (AY + 9) + "Q" + x + " " + (AY + 26) + " " + x2 + " " + (y2 - 9) + '"/><g class="tag pop"><circle cx="' + x2 + '" cy="' + y2 + '" r="9.5" fill="' + col(c) + '"/><text x="' + x2 + '" y="' + y2 + '">' + esc(c) + "</text></g>"; }).join("");
  }
  const liste = a => a.length > 1 ? a.slice(0, -1).join(", ") + " et " + a[a.length - 1] : a[0];
  function pick(i){
    if(R.done || R.tried.has(i)) return;
    const st = R.list[i], g = board.querySelector('.st[data-i="' + i + '"]'), extra = $("extra"), veh = $("veh"), round = R;
    R.tried.add(i); g.classList.add("done");
    if(!st.others.includes(R.b)){
      R.errs++; g.classList.add("bad", "shake");
      if(!S.miss.some(m => m.code === st.code)) S.miss.push(st);
      extra.insertAdjacentHTML("beforeend", stubs(i));
      res.innerHTML = '<span class="no">Pas ici.</span> ' + esc(st.code) + " : intersection avec " + esc(liste(st.others)) + ", pas avec " + esc(R.b) + ".";
      if(window.mtcMiss) window.mtcMiss();
      return;
    }
    R.done = true; g.classList.add("good");
    const x = sx(i);
    // la correspondance se dessine, puis le véhicule recule jusqu'à la station, descend et file au terminus
    extra.insertAdjacentHTML("beforeend", '<path class="link draw" style="--len:190" stroke="' + col(R.b) + '" d="M' + x + " " + (AY + 9) + "V" + (BY - 22) + "Q" + x + " " + BY + " " + (x + 22) + " " + BY + '"/>' + stubs(i, R.b));
    veh.classList.remove("bump");
    veh.style.transform = "translate(" + x + "px," + (AY - 19) + "px)";
    setTimeout(() => { if(R === round) veh.style.transform = "translate(" + (x + 19) + "px," + (BY - 40) + "px) rotate(90deg)"; }, 750);
    setTimeout(() => { if(R === round) veh.style.transform = "translate(" + (x + 30) + "px," + (BY - 19) + "px)"; }, 1500);
    setTimeout(() => { if(R === round) veh.style.transform = "translate(" + (X1 - 34) + "px," + (BY - 19) + "px)"; }, 2000);
    setTimeout(() => {
      if(R !== round) return;
      // le reste du plan se dévoile : les correspondances des autres stations
      R.list.forEach((s2, k) => { if(k !== i && !R.tried.has(k)) extra.insertAdjacentHTML("beforeend", stubs(k)); });
      board.querySelectorAll(".st").forEach(n => n.classList.add("done"));
    }, 2700);
    const net = !R.errs;
    S.marks.push(net ? "ok" : "mid");
    res.innerHTML = '<span class="ok">' + (net ? "Bien joué." : "Trouvé.") + "</span> " + esc(st.code) + " : intersection avec " + esc(liste(st.others)) + ".";
    // un trajet réussi du premier coup compte comme une bonne réponse du jour, comme dans les autres jeux
    if(net && window.mtcCelebrate) window.mtcCelebrate(1); else if(window.mtcPlayFx) window.mtcPlayFx("good");
    if(window.mtcRecordDailyPlay) window.mtcRecordDailyPlay();   // un trajet terminé compte pour la série de jours
    next.textContent = S.marks.length >= N ? "Voir le résultat →" : "Trajet suivant →";
    next.hidden = false; head();
  }
  function end(){
    const ok = S.marks.filter(m => m === "ok").length, old = best(), rec = ok > old;
    if(rec){ try{ localStorage.setItem(RKEY, String(ok)); }catch(e){} }
    main.classList.add("fin");
    $("end").innerHTML = "<h2>" + ok + (ok > 1 ? " trajets" : " trajet") + " sur " + N + " du premier coup</h2>" +
      '<p class="t">' + (rec && old ? "Nouveau record : l’ancien était de " + old + "." : rec ? "C’est ton premier record." : "Ton record : " + old + " sur " + N + ".") + "</p>" +
      (S.miss.length ? '<span class="sc t">Stations à revoir</span><ul>' + S.miss.sort((a, b) => a.code.localeCompare(b.code, "fr", {numeric:true})).map(st => "<li><b>" + esc(st.code) + "</b> " +
        st.others.map(c => '<span class="tg" style="background:' + col(c) + '">' + esc(c) + "</span>").join("") + "</li>").join("") + "</ul>" : '<span class="sc t">Aucune station manquée</span>') +
      '<p style="margin:22px 0 0"><a class="sc go" target="_top" href="index.html' + (window.mtcIsAdminPage && window.mtcIsAdminPage() ? "?admin=1" : "") + '#reseau">Plan des intersections →</a></p>';
    next.textContent = "Nouvelle série →"; next.hidden = false; head();
    if(ok === N && window.mtcFinale) window.mtcFinale("Série parfaite", N + " trajets du premier coup", {etoiles:"✦✦✦"});
  }
  next.addEventListener("click", () => { if(main.classList.contains("fin")) newSeries(); else if(S.marks.length >= N) end(); else newRound(); });
  newSeries();
})();
</script>
</body>
</html>
